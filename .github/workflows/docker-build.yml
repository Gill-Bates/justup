# .github/workflows/docker-build.yml: tag release for justUp.
# Calls ci.yml before publishing; docs-build.yml follows a successful release.
name: Docker Multi-Arch Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  # Release gate: the PR checks on the tagged commit. The ancestry check in
  # meta only proves the commit is on main, not that CI for it passed.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  meta:
    name: Validate build metadata
    needs: ci
    # Named runner image: ubuntu-latest migrates in stages and two runs of one
    # tag could otherwise land on different operating systems.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_newest: ${{ steps.newest.outputs.is_newest }}
      moves_latest: ${{ steps.newest.outputs.moves_latest }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      archs: ${{ steps.matrix.outputs.archs }}
      python_base: ${{ steps.rolling.outputs.python_base }}
      signal_cli_version: ${{ steps.rolling.outputs.signal_cli_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history for the main-ancestry check below.
          fetch-depth: 0

      # Pinned so tomllib (below) does not depend on the runner's system Python.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN secret}"

      - name: Validate and set build metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if ! echo "$DOCKERHUB_USERNAME" | grep -qE '^[a-z0-9][a-z0-9_-]{2,}$'; then
            echo "ERROR: Invalid Docker Hub username/namespace: '$DOCKERHUB_USERNAME'"
            exit 1
          fi

          # pyproject.toml [project] version is the single source of truth. A
          # missing file or key aborts here (pipefail); an empty value fails the format check.
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' | tr -d '[:space:]')"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected: X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          # Also applies to workflow_dispatch: select the tag as the ref.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: This workflow must run from a tag, but ref '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}."
            echo "Push tag v${VERSION}, or re-run this workflow selecting that tag as the ref."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "ERROR: Git tag (${GITHUB_REF_NAME}) does not match pyproject.toml version (${VERSION})"
            exit 1
          fi

          # A tag can be pushed from any branch; only commits on main passed ci.yml.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not contained in main."
            echo "Merge the release commit into main first, then tag that commit."
            exit 1
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAG="v${VERSION}"

          {
            echo "build_date=${BUILD_DATE}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Resolve shared release inputs once for both architecture builds.
      - name: Resolve rolling toolchain versions
        id: rolling
        run: |
          set -euo pipefail

          # By digest: both architectures build on the same index even if the tag moves mid-run.
          python_base="python:3.13-slim"
          digest="$(docker buildx imagetools inspect "$python_base" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "ERROR: could not resolve a digest for ${python_base}"; exit 1 ;;
          esac
          python_base="python:3.13-slim@${digest}"

          # Resolved once here, not per Docker build.
          signal_cli_version="$(curl -fsSL --retry 3 \
            https://api.github.com/repos/AsamK/signal-cli/releases/latest | jq -r '.tag_name // empty')"
          signal_cli_version="${signal_cli_version#v}"
          if [[ ! "$signal_cli_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "ERROR: could not resolve a signal-cli release (got '${signal_cli_version}')" >&2
            exit 1
          fi

          {
            echo "python_base=${python_base}"
            echo "signal_cli_version=${signal_cli_version}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved once for every architecture:"
          echo "  python base      : ${python_base}"
          echo "  signal-cli       : ${signal_cli_version}"

      # The only place architectures are declared: build, create-manifest,
      # release-newest.py and the release notes all derive from it. Native
      # runners, no QEMU; if arm64 queues or fails alone, ubuntu-24.04-arm is the fallback.
      - name: Declare build matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(jq -c . <<'JSON'
          {"include": [
            {"arch":"amd64","runner":"ubuntu-26.04","platform":"linux/amd64","cache_scope":"amd64","test_image":"justup:test-amd64","container_name":"justup-test-amd64","image_suffix":"amd64"},
            {"arch":"arm64","runner":"ubuntu-26.04-arm","platform":"linux/arm64","cache_scope":"arm64","test_image":"justup:test-arm64","container_name":"justup-test-arm64","image_suffix":"arm64"}
          ]}
          JSON
          )"
          archs="$(jq -r '[.include[].arch] | sort | join(" ")' <<< "$matrix")"
          {
            echo "matrix=${matrix}"
            echo "archs=${archs}"
          } >> "$GITHUB_OUTPUT"
          echo "Architectures: ${archs}"

      # A release must not travel backwards: re-running an older tag must not
      # move 'latest' or prune newer releases (irreversible on Docker Hub). The
      # published tags decide. The listing fails closed: only a missing
      # repository on the first page counts as "no tags", everything else stops.
      # is_newest gates the tag cleanup; moves_latest (stable and newest stable)
      # gates 'latest', so a newer prerelease cannot block it.
      - name: Determine whether this is the newest release
        id: newest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHS: ${{ steps.matrix.outputs.archs }}
        run: |
          set -euo pipefail
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          python3 tools/dockerhub.py list --allow-missing-repo > "$listing"
          # Unquoted: ARCHS is a space-separated list. Only key=value lines go to GITHUB_OUTPUT.
          # shellcheck disable=SC2086 # word splitting is intended
          python3 tools/release-newest.py "$listing" "$VERSION" $ARCHS >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/justup', secrets.DOCKERHUB_USERNAME) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The gha cache backend uses the runner's cache token, not GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      # libsignal is compiled from source and the cache export is close to a
      # stock runner's free space; none of these toolchains take part in the build.
      - name: Free disk space
        run: |
          set -uo pipefail
          echo "Before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "After:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false

      # Logged in only for the build and the push; the third-party Trivy action
      # runs in between without registry credentials.
      - name: Log in to Docker Hub (build)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The shared base digest and signal-cli release come from meta.
      - name: Build image for smoke tests
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform "${{ matrix.platform }}" \
            --target runtime \
            --load \
            --cache-from type=gha,scope=${{ matrix.cache_scope }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.cache_scope }} \
            --build-arg "PYTHON_BASE=${{ needs.meta.outputs.python_base }}" \
            --build-arg "SIGNAL_CLI_VERSION=${{ needs.meta.outputs.signal_cli_version }}" \
            --build-arg "APP_VERSION=${{ needs.meta.outputs.tag }}" \
            --build-arg "BUILD_DATE=${{ needs.meta.outputs.build_date }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            -t "${{ matrix.test_image }}" \
            -f docker/Dockerfile \
            .

      - name: Log out of Docker Hub
        run: docker logout

      - name: Smoke test justUp
        run: |
          set -euo pipefail

          # shellcheck disable=SC2317,SC2329  # invoked by the trap below, not inline (shellcheck >= 0.11 reports SC2329)
          cleanup() {
            docker rm -f "${{ matrix.container_name }}" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --name "${{ matrix.container_name }}" \
            --platform "${{ matrix.platform }}" \
            -e SECRET_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            "${{ matrix.test_image }}"

          echo "Waiting for in-container health endpoint..."
          for i in $(seq 1 45); do
            if ! docker ps -q -f name="${{ matrix.container_name }}" | grep -q .; then
              echo "✗ Container exited during startup after ${i}s"
              echo "=== Container logs ==="
              docker logs "${{ matrix.container_name }}" 2>&1 || echo "Could not retrieve logs"
              exit 1
            fi

            if docker exec "${{ matrix.container_name }}" python -c \
                'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)' \
                > /dev/null 2>&1; then
              echo "✓ justUp health check passed after ${i}s"
              exit 0
            fi

            sleep 1
          done

          echo "✗ Health check timeout after 45s"
          echo "=== Container logs ==="
          docker logs "${{ matrix.container_name }}" 2>&1 || echo "Could not retrieve logs"
          echo "=== Container status ==="
          docker ps -a -f name="${{ matrix.container_name }}"
          exit 1

      # Packaging and ELF header check only; it does not prove the JVM can load the library.
      - name: Verify libsignal native library packaging (${{ matrix.arch }})
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm -i --platform "${{ matrix.platform }}" \
            --entrypoint python "${{ matrix.test_image }}" - "$EXPECTED_ARCH" \
            < tools/verify-libsignal-native.py

      # Evidence for the parity gate in create-manifest, read from the finished
      # image: a stale cached layer would hide an older toolchain from build args.
      - name: Record toolchain versions (${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p toolchain

          # Versions of the distributions pyproject.toml names, as installed in the image.
          docker run --rm -i --platform "${{ matrix.platform }}" \
            --entrypoint python "${{ matrix.test_image }}" - \
            < tools/image-dependency-versions.py > "toolchain/${{ matrix.image_suffix }}.txt"
          signal_cli_version="$(docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint signal-cli "${{ matrix.test_image }}" --version)"
          printf 'signal_cli=%s\n' "$signal_cli_version" >> "toolchain/${{ matrix.image_suffix }}.txt"

          # COMPONENTS.txt mixes formats, so each value is extracted on its own.
          # Only arch-independent values belong here; library names and hashes differ by design.
          components="$(docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint cat "${{ matrix.test_image }}" /opt/COMPONENTS.txt)"
          java_version="$(printf '%s\n' "$components" \
            | sed -n 's/^JAVA_VERSION="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$java_version" ] || [ "$(printf '%s\n' "$java_version" | wc -l)" -ne 1 ]; then
            echo "ERROR: expected exactly one JAVA_VERSION in COMPONENTS.txt, got '${java_version}'"
            exit 1
          fi
          libsignal_client="$(printf '%s\n' "$components" \
            | sed -n 's/^libsignal-client-\(.\{1,\}\)\.jar$/\1/p')"
          if [ -z "$libsignal_client" ] || [ "$(printf '%s\n' "$libsignal_client" | wc -l)" -ne 1 ]; then
            echo "ERROR: expected exactly one libsignal-client jar in COMPONENTS.txt, got '${libsignal_client}'"
            exit 1
          fi
          printf 'java_version=%s\nlibsignal_client=%s\n' \
            "$java_version" "$libsignal_client" >> "toolchain/${{ matrix.image_suffix }}.txt"

          echo "--- ${{ matrix.image_suffix }} ---"
          cat "toolchain/${{ matrix.image_suffix }}.txt"

      - name: Upload toolchain versions (${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolchain-${{ matrix.image_suffix }}
          path: toolchain/${{ matrix.image_suffix }}.txt
          retention-days: 14
          if-no-files-found: error

      - name: Tag image for push
        run: |
          set -euo pipefail
          docker tag "${{ matrix.test_image }}" "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      - name: Trivy vulnerability scan
        # SHA-pinned: trivy-action tags were force-pushed to a credential-stealing
        # commit in March 2026 (GHSA-69fq-xp46-6x23). Runs between the Docker Hub logins.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'false'
          image-ref: '${{ matrix.test_image }}'
          # The reviewed action revision defaults to Trivy v0.70.0.
          format: 'json'
          output: 'trivy-${{ matrix.image_suffix }}.json'
          exit-code: '1'
          ignore-unfixed: true
          # Source secrets and misconfiguration are gated in ci.yml.
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
          trivyignores: '.trivyignore'

      - name: Generate Trivy summary (${{ matrix.arch }})
        if: always()
        run: |
          set -euo pipefail
          ARCH="${{ matrix.image_suffix }}"
          FILE="trivy-${ARCH}.json"

          if [[ ! -f "$FILE" ]]; then
            echo "### Trivy (${ARCH}): Scan failed — no results file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # An unreadable report is a failure, never "zero findings".
          if ! jq -e 'type == "object"' "$FILE" > /dev/null; then
            echo "### Trivy (${ARCH}): report is not valid JSON, not evaluated" >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: ${FILE} is not a valid Trivy report" >&2
            exit 1
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$FILE")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$FILE")

          if (( CRITICAL == 0 && HIGH == 0 )); then
            SUMMARY="✅ No HIGH/CRITICAL vulnerabilities found"
          else
            SUMMARY="⚠️ ${CRITICAL} CRITICAL, ${HIGH} HIGH vulnerabilities"
          fi

          echo "### Trivy Scan Results (${ARCH})" >> "$GITHUB_STEP_SUMMARY"
          if (( CRITICAL > 0 || HIGH > 0 )); then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH") | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.InstalledVersion)"' \
              "$FILE" | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy findings (${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-findings-${{ matrix.image_suffix }}
          path: trivy-${{ matrix.image_suffix }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push arch-specific image
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      # The manifest is built from digests, not mutable arch tags that are
      # deleted afterwards. A digest artifact exists exactly for the tags that
      # reached Docker Hub; cleanup-arch-tags relies on that.
      - name: Record image digest
        run: |
          set -euo pipefail
          mkdir -p digests

          digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}" \
            --format '{{.Manifest.Digest}}')"

          case "$digest" in
            sha256:*) ;;
            *)
              echo "ERROR: unexpected digest for ${{ matrix.image_suffix }}: '${digest}'"
              exit 1
              ;;
          esac

          printf '%s' "$digest" > "digests/${{ matrix.image_suffix }}"
          echo "${{ matrix.image_suffix }} -> ${digest}"

      - name: Upload image digest (${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digest-${{ matrix.image_suffix }}
          path: digests/${{ matrix.image_suffix }}
          retention-days: 1
          if-no-files-found: error

  create-manifest:
    name: Create multi-arch manifest
    needs: [meta, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/justup', secrets.DOCKERHUB_USERNAME) }}
      MOVES_LATEST: ${{ needs.meta.outputs.moves_latest }}
      EXPECTED_ARCHS: ${{ needs.meta.outputs.archs }}
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Download toolchain versions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: toolchain-*
          path: toolchain/
          merge-multiple: true

      # Expected architectures come from the matrix, never from what arrived: a
      # lost artifact must stop the release. merge-multiple overwrites duplicates
      # silently, so the files are compared as exact sets.
      - name: Verify digest and toolchain files match the build matrix
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_ARCHS// /}" ]]; then
            echo "ERROR: meta job declared no architectures"
            exit 1
          fi
          expected="$(tr ' ' '\n' <<< "$EXPECTED_ARCHS" | sort)"
          if [[ -n "$(uniq -d <<< "$expected")" ]]; then
            echo "ERROR: duplicate architecture in the matrix: ${EXPECTED_ARCHS}"
            exit 1
          fi
          shopt -s nullglob
          digest_files=(digests/*)
          toolchain_files=(toolchain/*)
          found_digests="$( (( ${#digest_files[@]} )) && printf '%s\n' "${digest_files[@]##*/}" | sort || true)"
          found_toolchain="$( (( ${#toolchain_files[@]} )) && printf '%s\n' "${toolchain_files[@]##*/}" | sed 's/\.txt$//' | sort || true)"
          if [[ "$found_digests" != "$expected" ]]; then
            echo "ERROR: digest files [$(tr '\n' ' ' <<< "$found_digests")] differ from the build matrix [${EXPECTED_ARCHS}]"
            exit 1
          fi
          if [[ "$found_toolchain" != "$expected" ]]; then
            echo "ERROR: toolchain files [$(tr '\n' ' ' <<< "$found_toolchain")] differ from the build matrix [${EXPECTED_ARCHS}]"
            exit 1
          fi
          for file in "${digest_files[@]}"; do
            if ! grep -qE '^sha256:[0-9a-f]{64}$' "$file"; then
              echo "ERROR: ${file} does not contain a sha256 digest"
              exit 1
            fi
          done
          echo "OK: digests and toolchain manifests exist for exactly: ${EXPECTED_ARCHS}"

      # Parity gate: runs before the manifest exists, so a mismatch stops the publish.
      - name: Verify architectures carry identical versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys

          # The file set equals the matrix (previous step), so it is never empty.
          files = sorted(pathlib.Path("toolchain").glob("*.txt"))

          def read(path):
              out = {}
              for line in path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  name, _, value = line.partition("=")
                  out[name] = value
              return out

          recorded = {path.stem: read(path) for path in files}
          for arch, versions in recorded.items():
              print(f"--- {arch} ---")
              for name, value in sorted(versions.items()):
                  print(f"  {name}={value}")

          if len(recorded) < 2:
              sys.exit("FAIL: parity needs at least two architectures, got " + ", ".join(recorded))

          names = sorted({name for versions in recorded.values() for name in versions})
          mismatches = []
          for name in names:
              seen = {arch: versions.get(name, "<missing>") for arch, versions in recorded.items()}
              if len(set(seen.values())) > 1:
                  detail = ", ".join(f"{arch}={value}" for arch, value in sorted(seen.items()))
                  mismatches.append(f"{name}: {detail}")

          if mismatches:
              print("\nFAIL: the architectures do not carry the same versions:", file=sys.stderr)
              for mismatch in mismatches:
                  print(f"  {mismatch}", file=sys.stderr)
              print(
                  "\nEvery rolling component is resolved once in the meta job and passed "
                  "to both builds, so this means a build arg did not reach the Dockerfile, "
                  "or a stale cached layer was reused.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"\nOK: {', '.join(sorted(recorded))} carry identical versions of all {len(names)} components")
          PY

      - name: Create and push manifest
        run: |
          set -euo pipefail

          # One file per architecture, named after it, holding its digest (set verified above).
          digest_files=(digests/*)

          declare -a sources=()
          declare -a platforms=()
          echo "Assembling index from:"
          for file in "${digest_files[@]}"; do
            arch="$(basename "$file")"
            digest="$(tr -d '[:space:]' < "$file")"
            sources+=("${IMAGE_NAME}@${digest}")
            platforms+=("linux/${arch}")
            echo "  linux/${arch}  ${digest}"
          done

          # Version tag only; 'latest' follows after verification.
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            "${sources[@]}"
          echo "Pushed manifest: ${IMAGE_NAME}:${VERSION}"

          printf '%s\n' "${platforms[@]}" > expected-platforms.txt

      # imagetools create only confirms the registry accepted the index. Check
      # that it lists the expected platforms with the digests that were scanned and pushed.
      - name: Verify manifest
        run: |
          set -euo pipefail

          cat > verify_manifest.py <<'PY'
          import json
          import pathlib
          import sys

          manifest_file, expected_file, digest_dir = sys.argv[1], sys.argv[2], sys.argv[3]

          with open(manifest_file, encoding="utf-8") as handle:
              index = json.load(handle)
          with open(expected_file, encoding="utf-8") as handle:
              expected = sorted(line.strip() for line in handle if line.strip())
          # linux/<arch> -> the digest the build job scanned and pushed.
          expected_digests = {
              f"linux/{path.name}": path.read_text(encoding="utf-8").strip()
              for path in pathlib.Path(digest_dir).iterdir()
          }

          manifests = index.get("manifests")
          if manifests is None:
              sys.exit(f"FAIL: {manifest_file} is not a manifest index")

          # Identity includes the variant; the expected set is compared at os/architecture level.
          identities = []
          found = set()
          found_digests = {}
          for entry in manifests:
              platform = entry.get("platform") or {}
              architecture = platform.get("architecture")
              # Attestations ride along as unknown/unknown entries.
              if not architecture or architecture == "unknown":
                  continue
              operating_system = platform.get("os")
              identities.append(
                  (operating_system, architecture, platform.get("variant") or "")
              )
              found.add(f"{operating_system}/{architecture}")
              found_digests[f"{operating_system}/{architecture}"] = entry.get("digest")

          duplicates = sorted({
              "/".join(part for part in identity if part)
              for identity in identities
              if identities.count(identity) > 1
          })
          if duplicates:
              sys.exit(f"FAIL: index lists duplicate platforms: {', '.join(duplicates)}")

          if sorted(found) != expected:
              sys.exit(f"FAIL: index describes {sorted(found)}, expected {expected}")

          if found_digests != expected_digests:
              sys.exit(f"FAIL: index digests {found_digests} differ from the pushed {expected_digests}")

          print(f"OK: {manifest_file} describes {', '.join(sorted(found))} with the pushed digests")
          PY

          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" > manifest-version.json
          python3 verify_manifest.py manifest-version.json expected-platforms.txt digests

      # 'latest' moves only after the version index passed verification, and
      # only for the newest stable release (moves_latest). It points at the verified digest.
      - name: Promote latest
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping 'latest': ${VERSION} is a prerelease"
            exit 0
          fi
          if [[ "$MOVES_LATEST" != "true" ]]; then
            echo "Skipping 'latest': a newer stable version is already published"
            exit 0
          fi

          index_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
            --format '{{.Manifest.Digest}}')"
          case "$index_digest" in
            sha256:*) ;;
            *) echo "ERROR: could not resolve the digest of ${IMAGE_NAME}:${VERSION}"; exit 1 ;;
          esac

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}@${index_digest}"
          echo "Pushed manifest: ${IMAGE_NAME}:latest -> ${index_digest}"

          docker buildx imagetools inspect --raw "${IMAGE_NAME}:latest" > manifest-latest.json
          python3 verify_manifest.py manifest-latest.json expected-platforms.txt digests

  # always(): a failed or cancelled build leaves arch tags on Docker Hub that
  # nothing else would remove. Deletes exactly the tags that have a digest
  # artifact, i.e. those the build jobs reported pushing.
  cleanup-arch-tags:
    name: Remove architecture fragment tags
    needs: [meta, build, create-manifest]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # continue-on-error: "no artifact" is a valid state when builds failed early.
      - name: Download image digests
        id: digests
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Delete architecture tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          # meta may have failed: no version, nothing pushed.
          if [[ -z "${VERSION}" ]]; then
            echo "No version resolved - nothing to clean up."
            exit 0
          fi

          shopt -s nullglob
          digest_files=(digests/*)
          if (( ${#digest_files[@]} == 0 )); then
            echo "No image digests were published - no architecture tags exist."
            exit 0
          fi

          tags=()
          for file in "${digest_files[@]}"; do
            tags+=("${VERSION}-$(basename "$file")")
          done
          python3 tools/dockerhub.py delete "${tags[@]}"

  # DESTRUCTIVE: deletes every tag except the current version and 'latest'
  # (irreversible on Docker Hub), so it needs a verified manifest and is_newest:
  # an older re-run must not delete the releases that came after it. Runs after
  # the fragment cleanup so the two do not race on the same arch tags. A failure
  # turns the workflow red but does not block the GitHub release.
  cleanup-dockerhub-tags:
    name: Keep only latest and current version tag
    needs: [meta, create-manifest, cleanup-arch-tags]
    if: >-
      needs.create-manifest.result == 'success' &&
      needs.cleanup-arch-tags.result == 'success' &&
      needs.meta.outputs.is_newest == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Delete all non-current Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          echo "Keeping Docker Hub tags: ${VERSION} latest"

          # The complete listing is read first; a failed page exits before anything is deleted.
          python3 tools/dockerhub.py list > "$work/before.txt"

          # Release policy: keep the current version and 'latest', delete the rest.
          # grep exits 1 when nothing is left to delete, which is fine.
          grep -vxF -e "$VERSION" -e latest "$work/before.txt" > "$work/stale.txt" || [[ $? -eq 1 ]]
          mapfile -t stale_tags < "$work/stale.txt"
          if (( ${#stale_tags[@]} > 0 )); then
            python3 tools/dockerhub.py delete --verify "${stale_tags[@]}"
          fi

          # Re-list: only the kept tags may remain, and they must still exist.
          python3 tools/dockerhub.py list > "$work/after.txt"
          grep -vxF -e "$VERSION" -e latest "$work/after.txt" > "$work/unexpected.txt" || [[ $? -eq 1 ]]
          if [[ -s "$work/unexpected.txt" ]]; then
            echo "ERROR: unexpected tags remained after cleanup:"
            cat "$work/unexpected.txt"
            exit 1
          fi

          # Prereleases never publish 'latest' (see create-manifest).
          expected_tags=("$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            expected_tags+=(latest)
          fi
          for tag in "${expected_tags[@]}"; do
            if ! grep -qxF "$tag" "$work/after.txt"; then
              echo "ERROR: expected tag missing after cleanup: $tag"
              exit 1
            fi
          done

  create-release:
    name: Create GitHub Release
    # Documents the verified manifest. Deliberately not after cleanup-dockerhub-tags:
    # tag pruning failing must not hide an already published, verified release.
    needs: [meta, create-manifest]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/justup', secrets.DOCKERHUB_USERNAME) }}
      MOVES_LATEST: ${{ needs.meta.outputs.moves_latest }}
      ARCHS: ${{ needs.meta.outputs.archs }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download Trivy findings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: trivy-findings-*
          path: trivy-reports/
          merge-multiple: false

      # The release body links to the reports: they must exist and parse before
      # a public release is created or updated.
      - name: Validate Trivy findings
        run: |
          set -euo pipefail
          read -ra archs <<< "$ARCHS"
          for arch in "${archs[@]}"; do
            report="trivy-reports/trivy-findings-${arch}/trivy-${arch}.json"
            if [[ ! -s "$report" ]]; then
              echo "ERROR: missing or empty Trivy report: ${report}"
              exit 1
            fi
            if ! jq empty "$report"; then
              echo "ERROR: Trivy report is not valid JSON: ${report}"
              exit 1
            fi
          done

      - name: Create or update GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.VERSION;
            const imageName = process.env.IMAGE_NAME;
            const isPrerelease = version.includes('-');
            // Mirrors create-manifest: do not document a 'latest' this run left alone.
            const movedLatest = !isPrerelease && process.env.MOVES_LATEST === 'true';
            const tagName = 'v' + version;
            const archs = process.env.ARCHS.split(' ');

            function parseTrivyStatus(arch) {
              const file = path.join('trivy-reports', `trivy-findings-${arch}`, `trivy-${arch}.json`);
              // Validated in the previous step; a read or parse error fails the job.
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              let critical = 0, high = 0;
              for (const result of (data.Results || [])) {
                for (const vuln of (result.Vulnerabilities || [])) {
                  if (vuln.Severity === 'CRITICAL') critical++;
                  else if (vuln.Severity === 'HIGH') high++;
                }
              }
              return (critical === 0 && high === 0)
                ? '✅ No HIGH/CRITICAL vulnerabilities found'
                : `⚠️ ${critical} CRITICAL, ${high} HIGH vulnerabilities`;
            }

            function extractVersionSection(markdown, targetVersion) {
              const headingPattern = /^## \[([^\]]+)\] - .+$/gm;
              let startIndex = -1;
              let endIndex = markdown.length;
              let match;

              while ((match = headingPattern.exec(markdown)) !== null) {
                if (startIndex === -1 && match[1] === targetVersion) {
                  startIndex = match.index;
                  continue;
                }
                if (startIndex !== -1) {
                  endIndex = match.index;
                  break;
                }
              }

              if (startIndex === -1) {
                return null;
              }
              // The changelog wraps older entries in <details>; drop that markup from the notes.
              return markdown.slice(startIndex, endIndex)
                .replace(/<details[^>]*>\s*<summary>.*?<\/summary>/gs, '')
                .replace(/<\/details>/g, '')
                .trim();
            }

            // A missing section has a defined fallback text; an unreadable CHANGELOG.md fails the job.
            const changelogSection = extractVersionSection(fs.readFileSync('CHANGELOG.md', 'utf8'), version);
            if (!changelogSection) {
              console.log('No matching changelog section found for version ' + version);
            }

            const tags = [
              '- `' + imageName + ':' + version + '` (multi-arch)'
            ];
            if (movedLatest) {
              tags.push('- `' + imageName + ':latest` (multi-arch)');
            } else if (!isPrerelease) {
              tags.push('- `' + imageName + ':latest` was left on a newer release');
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Reports are attached to the release below because run artifacts expire.
            const assetBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}`;
            const trivyRows = archs.map(arch =>
              `| ${arch} | ${parseTrivyStatus(arch)} | [trivy-${arch}.json](${assetBase}/trivy-${arch}.json) |`);

            const body = [
              '## justUp! ' + version,
              '',
              '**Docker Image:** `docker pull ' + imageName + ':' + version + '`',
              '',
              '### Available Tags',
              ...tags,
              '',
              '### Security Scan Results',
              '',
              '| Architecture | Status | Findings |',
              '|---|---|---|',
              ...trivyRows,
              '| run | workflow details | [Actions Run](' + runUrl + ') |',
              '',
              '> Scanned with [Trivy](https://trivy.dev/) for HIGH and CRITICAL severity vulnerabilities (unfixed CVEs ignored).',
              '',
              '### Changelog',
              changelogSection || '_No matching CHANGELOG entry found for this version._',
              '',
              '**Source:** [justUp! Repository](https://github.com/' + context.repo.owner + '/' + context.repo.repo + ')'
            ].join('\n');

            const releaseFields = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: 'justUp! ' + version,
              body: body,
              draft: false,
              prerelease: isPrerelease
            };

            // Look up first instead of treating every 422 as "already exists".
            let release = null;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              }));
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (release) {
              ({ data: release } = await github.rest.repos.updateRelease({
                ...releaseFields,
                release_id: release.id
              }));
              console.log('Updated release ' + tagName);
            } else {
              ({ data: release } = await github.rest.repos.createRelease(releaseFields));
              console.log('Created release ' + tagName);
            }

            // Attach the scan reports; any failure here fails the job because the body links to them.
            for (const arch of archs) {
              const assetName = `trivy-${arch}.json`;
              const file = path.join('trivy-reports', `trivy-findings-${arch}`, assetName);
              const data = fs.readFileSync(file);
              const existing = (release.assets || []).find(a => a.name === assetName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: assetName,
                data: data,
                headers: {
                  'content-type': 'application/json',
                  'content-length': data.length
                }
              });
              console.log('Attached ' + assetName);
            }
