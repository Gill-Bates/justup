# .github/workflows/docker-build.yml: tag release for justUp.
# Calls ci.yml before publishing; docs-build.yml follows a successful release.
name: Docker Multi-Arch Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  # Release gate: the PR checks on the tagged commit. The ancestry check in
  # meta only proves the commit is on main, not that CI for it passed.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  meta:
    name: Validate build metadata
    needs: ci
    # Named runner image: ubuntu-latest migrates in stages and two runs of one
    # tag could otherwise land on different operating systems.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
      is_newest: ${{ steps.newest.outputs.is_newest }}
      moves_latest: ${{ steps.newest.outputs.moves_latest }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      archs: ${{ steps.matrix.outputs.archs }}
      python_base: ${{ steps.rolling.outputs.python_base }}
      signal_cli_version: ${{ steps.rolling.outputs.signal_cli_version }}
      nmap_version: ${{ steps.rolling.outputs.nmap_version }}
      nmap_source_sha256: ${{ steps.rolling.outputs.nmap_source_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Full history for the main-ancestry check below.
          fetch-depth: 0

      # Pinned so tomllib (below) does not depend on the runner's system Python.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN secret}"

      - name: Validate and set build metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if ! echo "$DOCKERHUB_USERNAME" | grep -qE '^[a-z0-9][a-z0-9_-]{2,}$'; then
            echo "ERROR: Invalid Docker Hub username/namespace: '$DOCKERHUB_USERNAME'"
            exit 1
          fi

          # pyproject.toml [project] version is the single source of truth. A
          # missing file or key aborts here (pipefail); an empty value fails the format check.
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' | tr -d '[:space:]')"

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected: X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          # Also applies to workflow_dispatch: select the tag as the ref.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: This workflow must run from a tag, but ref '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}."
            echo "Push tag v${VERSION}, or re-run this workflow selecting that tag as the ref."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "ERROR: Git tag (${GITHUB_REF_NAME}) does not match pyproject.toml version (${VERSION})"
            exit 1
          fi

          # The tagged commit was checked by the reusable CI job above and must also be on main.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not contained in main."
            echo "Merge the release commit into main first, then tag that commit."
            exit 1
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAG="v${VERSION}"
          # Run-specific temporary tag for the unverified index. It does not parse as a
          # release (release-newest.py ignores it) and cleanup-arch-tags derives it again.
          CANDIDATE_TAG="candidate-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "build_date=${BUILD_DATE}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "candidate_tag=${CANDIDATE_TAG}"
          } >> "$GITHUB_OUTPUT"

      # Resolve shared release inputs once for both architecture builds.
      - name: Resolve rolling toolchain versions
        id: rolling
        run: |
          set -euo pipefail

          # By digest: both architectures build on the same index even if the tag moves mid-run.
          python_base="python:3.13-slim"
          digest="$(docker buildx imagetools inspect "$python_base" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "ERROR: could not resolve a digest for ${python_base}"; exit 1 ;;
          esac
          python_base="python:3.13-slim@${digest}"

          # Resolved once here, not per Docker build.
          signal_cli_version="$(curl -fsSL --retry 3 \
            https://api.github.com/repos/AsamK/signal-cli/releases/latest | jq -r '.tag_name // empty')"
          signal_cli_version="${signal_cli_version#v}"
          if [[ ! "$signal_cli_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "ERROR: could not resolve a signal-cli release (got '${signal_cli_version}')" >&2
            exit 1
          fi

          nmap_version="$(python3 tools/nmap-release.py latest)"
          if [[ ! "$nmap_version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "ERROR: could not resolve the official stable Nmap release (got '${nmap_version}')" >&2
            exit 1
          fi

          # Verify the release against the pinned Nmap signing key once, before any build
          # starts; a failed signature aborts the release. Both architecture builds receive
          # the archive hash and must download exactly that archive.
          verify_dir="${RUNNER_TEMP}/nmap-verify"
          python3 tools/nmap-release.py fetch "$nmap_version" "$verify_dir"
          nmap_source_sha256="$(sed -n 's/^source_sha256=//p' "${verify_dir}/provenance.txt")"
          if [[ ! "$nmap_source_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: Nmap source hash missing after verification" >&2
            exit 1
          fi

          {
            echo "python_base=${python_base}"
            echo "signal_cli_version=${signal_cli_version}"
            echo "nmap_version=${nmap_version}"
            echo "nmap_source_sha256=${nmap_source_sha256}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved once for every architecture:"
          echo "  python base      : ${python_base}"
          echo "  signal-cli       : ${signal_cli_version}"
          echo "  nmap             : ${nmap_version}, source sha256 ${nmap_source_sha256}"

      # The only place architectures are declared: build, create-manifest,
      # release-newest.py and the release notes all derive from it. Native
      # runners, no QEMU; if arm64 queues or fails alone, ubuntu-24.04-arm is the fallback.
      - name: Declare build matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(jq -c . <<'JSON'
          {"include": [
            {"arch":"amd64","runner":"ubuntu-26.04","platform":"linux/amd64","cache_scope":"amd64","test_image":"justup:test-amd64","container_name":"justup-test-amd64","image_suffix":"amd64"},
            {"arch":"arm64","runner":"ubuntu-26.04-arm","platform":"linux/arm64","cache_scope":"arm64","test_image":"justup:test-arm64","container_name":"justup-test-arm64","image_suffix":"arm64"}
          ]}
          JSON
          )"
          archs="$(jq -r '[.include[].arch] | sort | join(" ")' <<< "$matrix")"
          {
            echo "matrix=${matrix}"
            echo "archs=${archs}"
          } >> "$GITHUB_OUTPUT"
          echo "Architectures: ${archs}"

      # A release must not travel backwards: re-running an older tag must not
      # move 'latest' or prune newer releases (irreversible on Docker Hub). The
      # published tags decide. The listing fails closed: only a missing
      # repository on the first page counts as "no tags", everything else stops.
      # is_newest gates the tag cleanup; moves_latest (stable and newest stable)
      # gates 'latest', so a newer prerelease cannot block it.
      - name: Determine whether this is the newest release
        id: newest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHS: ${{ steps.matrix.outputs.archs }}
        run: |
          set -euo pipefail
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          python3 tools/dockerhub.py list --allow-missing-repo > "$listing"
          # Unquoted: ARCHS is a space-separated list. Only key=value lines go to GITHUB_OUTPUT.
          # shellcheck disable=SC2086 # word splitting is intended
          python3 tools/release-newest.py "$listing" "$VERSION" $ARCHS >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: meta
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/justup', secrets.DOCKERHUB_USERNAME) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # The gha cache backend uses the runner's cache token, not GITHUB_TOKEN.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      # libsignal is compiled from source and the cache export is close to a
      # stock runner's free space; none of these toolchains take part in the build.
      - name: Free disk space
        run: |
          set -uo pipefail
          echo "Before:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "After:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false

      # Logged in only for the build and the push; the third-party Trivy action
      # runs in between without registry credentials.
      - name: Log in to Docker Hub (build)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The shared base digest and signal-cli release come from meta.
      - name: Build image for smoke tests
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --platform "${{ matrix.platform }}" \
            --target runtime \
            --load \
            --cache-from type=gha,scope=${{ matrix.cache_scope }} \
            --cache-to type=gha,mode=max,scope=${{ matrix.cache_scope }} \
            --build-arg "PYTHON_BASE=${{ needs.meta.outputs.python_base }}" \
            --build-arg "SIGNAL_CLI_VERSION=${{ needs.meta.outputs.signal_cli_version }}" \
            --build-arg "NMAP_VERSION=${{ needs.meta.outputs.nmap_version }}" \
            --build-arg "NMAP_SOURCE_SHA256=${{ needs.meta.outputs.nmap_source_sha256 }}" \
            --build-arg "APP_VERSION=${{ needs.meta.outputs.tag }}" \
            --build-arg "BUILD_DATE=${{ needs.meta.outputs.build_date }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            -t "${{ matrix.test_image }}" \
            -f docker/Dockerfile \
            .

      - name: Log out of Docker Hub
        run: docker logout

      - name: Smoke test justUp
        run: |
          set -euo pipefail

          # shellcheck disable=SC2317,SC2329  # invoked by the trap below, not inline (shellcheck >= 0.11 reports SC2329)
          cleanup() {
            docker rm -f "${{ matrix.container_name }}" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --name "${{ matrix.container_name }}" \
            --platform "${{ matrix.platform }}" \
            -e SECRET_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            "${{ matrix.test_image }}"

          echo "Waiting for in-container health endpoint..."
          for i in $(seq 1 45); do
            if ! docker ps -q -f name="${{ matrix.container_name }}" | grep -q .; then
              echo "✗ Container exited during startup after ${i}s"
              echo "=== Container logs ==="
              docker logs "${{ matrix.container_name }}" 2>&1 || echo "Could not retrieve logs"
              exit 1
            fi

            if docker exec "${{ matrix.container_name }}" python -c \
                'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)' \
                > /dev/null 2>&1; then
              echo "✓ justUp health check passed after ${i}s"
              exit 0
            fi

            sleep 1
          done

          echo "✗ Health check timeout after 45s"
          echo "=== Container logs ==="
          docker logs "${{ matrix.container_name }}" 2>&1 || echo "Could not retrieve logs"
          echo "=== Container status ==="
          docker ps -a -f name="${{ matrix.container_name }}"
          exit 1

      - name: Verify Nmap TCP and UDP in the runtime image (${{ matrix.arch }})
        env:
          EXPECTED_NMAP_VERSION: ${{ needs.meta.outputs.nmap_version }}
          EXPECTED_NMAP_SOURCE_SHA256: ${{ needs.meta.outputs.nmap_source_sha256 }}
          TEST_IMAGE: ${{ matrix.test_image }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(docker run --rm --platform "$PLATFORM" --entrypoint /usr/bin/nmap "$TEST_IMAGE" --version \
            | sed -n 's/^Nmap version \([^ ]*\).*/\1/p')"
          if [[ "$actual" != "$EXPECTED_NMAP_VERSION" ]]; then
            echo "ERROR: Nmap version ${actual} differs from resolved ${EXPECTED_NMAP_VERSION}" >&2
            exit 1
          fi
          echo "NMAP_ACTUAL_VERSION=${actual}" >> "$GITHUB_ENV"

          docker run --rm --platform "$PLATFORM" --user 1000:1000 \
            --entrypoint /usr/bin/nmap "$TEST_IMAGE" \
            -sT -Pn -n -p 9 --max-retries 0 --host-timeout 10s -oX - 127.0.0.1 \
            > "${RUNNER_TEMP}/nmap-tcp-${ARCH}.xml"

          # The worker's steady-state UID is non-root with only ambient NET_RAW.
          docker run --rm --platform "$PLATFORM" --cap-drop ALL \
            --cap-add NET_RAW --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --entrypoint /usr/bin/setpriv "$TEST_IMAGE" \
            --inh-caps +net_raw --ambient-caps +net_raw \
            --reuid 1000 --regid 1000 --clear-groups \
            /usr/bin/nmap --privileged -sU -Pn -n -p 9 \
            --max-retries 0 --host-timeout 10s -oX - 127.0.0.1 \
            > "${RUNNER_TEMP}/nmap-udp-${ARCH}.xml"

          python3 - "$ARCH" "$RUNNER_TEMP" <<'PY'
          import sys
          from pathlib import Path
          from xml.etree import ElementTree

          arch, directory = sys.argv[1], Path(sys.argv[2])
          for protocol in ("tcp", "udp"):
              root = ElementTree.parse(directory / f"nmap-{protocol}-{arch}.xml").getroot()
              assert root.tag == "nmaprun"
              assert root.find("scaninfo").get("protocol") == protocol
              assert root.find(".//port").get("portid") == "9"
          PY

          docker run --rm --platform "$PLATFORM" --entrypoint cat "$TEST_IMAGE" \
            /usr/share/doc/nmap/PROVENANCE.txt > "nmap-provenance-${ARCH}.txt"
          grep -qx "nmap_version=${actual}" "nmap-provenance-${ARCH}.txt"
          # Same signed source as the one verified once in meta.
          grep -qx "source_sha256=${EXPECTED_NMAP_SOURCE_SHA256}" "nmap-provenance-${ARCH}.txt"
          grep -qx "architecture=${ARCH}" "nmap-provenance-${ARCH}.txt"
          grep -qx 'signing_key_fingerprint=436D66AB9A798425FDA0E3F801AF9F036B9355D0' "nmap-provenance-${ARCH}.txt"
          grep -qx 'build_method=verified-source' "nmap-provenance-${ARCH}.txt"
          # The recorded binary hash is the hash of the binary the image actually ships.
          shipped="$(docker run --rm --platform "$PLATFORM" --entrypoint sha256sum "$TEST_IMAGE" /usr/bin/nmap | cut -d' ' -f1)"
          grep -qx "binary_sha256=${shipped}" "nmap-provenance-${ARCH}.txt"
          grep -q '^runtime_dependencies=' "nmap-provenance-${ARCH}.txt"
          docker run --rm -i --platform "$PLATFORM" --entrypoint python "$TEST_IMAGE" - binary "$ARCH" < tools/verify-nmap-worker.py
          docker run --rm --platform "$PLATFORM" --entrypoint sh "$TEST_IMAGE" \
            -c 'test -s /usr/share/doc/nmap/LICENSE && test -s /usr/share/doc/nmap/NOTICE.txt'

      # The shipped startup path: the container runs with the compose hardening, the entrypoint
      # starts the Nmap worker, and the scan goes through the web user's client to the worker
      # socket against this container's own address (a local test target only).
      - name: Verify Nmap worker privilege separation and scans (${{ matrix.arch }})
        env:
          TEST_IMAGE: ${{ matrix.test_image }}
          PLATFORM: ${{ matrix.platform }}
          CONTAINER: nmap-worker-${{ matrix.arch }}
        run: |
          set -euo pipefail
          trap 'docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$CONTAINER" --platform "$PLATFORM" --init \
            --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add SETUID --cap-add SETGID --cap-add NET_RAW \
            --security-opt no-new-privileges:true \
            -e SECRET_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" "$TEST_IMAGE"
          for _ in $(seq 1 45); do
            docker exec -u justup "$CONTAINER" test -S /run/justup/nmap.sock 2>/dev/null && break
            sleep 1
          done
          docker exec -u justup "$CONTAINER" test -S /run/justup/nmap.sock
          docker exec -i "$CONTAINER" python - capabilities < tools/verify-nmap-worker.py
          docker exec -i -u justup "$CONTAINER" python - scan < tools/verify-nmap-worker.py
          # Traceroute as the web user through the worker socket under the NET_RAW-only profile.
          docker exec -i -u justup "$CONTAINER" python - trace < tools/verify-nmap-worker.py
          docker exec -i "$CONTAINER" python - status < tools/verify-nmap-worker.py
          # A killed worker is restarted by the supervisor and scans work again.
          worker_pid="$(docker top "$CONTAINER" -eo pid,args | awk '/app\.services\.nmap_worker/ && !/awk/ {print $1; exit}')"
          [[ -n "$worker_pid" ]]
          sudo kill -9 "$worker_pid"
          for _ in $(seq 1 60); do
            if docker exec -u justup "$CONTAINER" test -S /run/justup/nmap.sock 2>/dev/null \
                && docker exec -i "$CONTAINER" python - status < tools/verify-nmap-worker.py >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec -i "$CONTAINER" python - status < tools/verify-nmap-worker.py
          docker exec -i -u justup "$CONTAINER" python - scan < tools/verify-nmap-worker.py
          docker exec -i -u justup "$CONTAINER" python - trace < tools/verify-nmap-worker.py
          # Traceroute runs through Nmap; the mtr tools must be gone from the image.
          if docker exec "$CONTAINER" sh -c 'command -v mtr || command -v mtr-packet || test -e /usr/bin/mtr'; then
            echo "ERROR: mtr is still present in the runtime image" >&2
            exit 1
          fi

      - name: Upload Nmap provenance (${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nmap-provenance-${{ matrix.arch }}
          path: nmap-provenance-${{ matrix.arch }}.txt
          retention-days: 14
          if-no-files-found: error

      # Packaging, ELF header and a dlopen of the library (--load); JNI_OnLoad inside the JVM
      # and a real Signal send stay a manual gate.
      - name: Verify libsignal native library (${{ matrix.arch }})
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm -i --platform "${{ matrix.platform }}" \
            --entrypoint python "${{ matrix.test_image }}" - --load "$EXPECTED_ARCH" \
            < tools/verify-libsignal-native.py

      # Runtime image purity (contract in tools/verify-runtime-image.py): no build tools,
      # caches, source trees or object files, neither in the final file system nor in
      # any layer (an artifact deleted by a later layer is still shipped). Runs before the push.
      - name: Verify runtime image purity (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          TEST_IMAGE: ${{ matrix.test_image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker run --rm -i --platform "$PLATFORM" \
            --entrypoint python "$TEST_IMAGE" - fs "$ARCH" \
            < tools/verify-runtime-image.py

          archive="${RUNNER_TEMP}/runtime-image-${ARCH}.tar"
          trap 'rm -f "$archive"' EXIT
          docker save "$TEST_IMAGE" -o "$archive"
          python3 tools/verify-runtime-image.py layers "$archive"

      # Evidence for the parity gate in create-manifest, read from the finished
      # image: a stale cached layer would hide an older toolchain from build args.
      - name: Record toolchain versions (${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p toolchain

          # Versions of the distributions pyproject.toml names, as installed in the image.
          docker run --rm -i --platform "${{ matrix.platform }}" \
            --entrypoint python "${{ matrix.test_image }}" - \
            < tools/image-dependency-versions.py > "toolchain/${{ matrix.image_suffix }}.txt"
          signal_cli_version="$(docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint signal-cli "${{ matrix.test_image }}" --version)"
          printf 'signal_cli=%s\n' "$signal_cli_version" >> "toolchain/${{ matrix.image_suffix }}.txt"
          printf 'nmap=%s\n' "$NMAP_ACTUAL_VERSION" >> "toolchain/${{ matrix.image_suffix }}.txt"
          # Taken from the image, not from the build args: a stale layer cannot hide a different archive.
          nmap_source_sha256="$(docker run --rm --platform "${{ matrix.platform }}" --entrypoint cat \
            "${{ matrix.test_image }}" /usr/share/doc/nmap/PROVENANCE.txt | sed -n 's/^source_sha256=//p')"
          printf 'nmap_source_sha256=%s\n' "$nmap_source_sha256" >> "toolchain/${{ matrix.image_suffix }}.txt"

          # COMPONENTS.txt mixes formats, so each value is extracted on its own.
          # Only arch-independent values belong here; library names and hashes differ by design.
          components="$(docker run --rm --platform "${{ matrix.platform }}" \
            --entrypoint cat "${{ matrix.test_image }}" /opt/COMPONENTS.txt)"
          java_version="$(printf '%s\n' "$components" \
            | sed -n 's/^JAVA_VERSION="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$java_version" ] || [ "$(printf '%s\n' "$java_version" | wc -l)" -ne 1 ]; then
            echo "ERROR: expected exactly one JAVA_VERSION in COMPONENTS.txt, got '${java_version}'"
            exit 1
          fi
          libsignal_client="$(printf '%s\n' "$components" \
            | sed -n 's/^libsignal-client-\(.\{1,\}\)\.jar$/\1/p')"
          if [ -z "$libsignal_client" ] || [ "$(printf '%s\n' "$libsignal_client" | wc -l)" -ne 1 ]; then
            echo "ERROR: expected exactly one libsignal-client jar in COMPONENTS.txt, got '${libsignal_client}'"
            exit 1
          fi
          printf 'java_version=%s\nlibsignal_client=%s\n' \
            "$java_version" "$libsignal_client" >> "toolchain/${{ matrix.image_suffix }}.txt"

          echo "--- ${{ matrix.image_suffix }} ---"
          cat "toolchain/${{ matrix.image_suffix }}.txt"

      - name: Upload toolchain versions (${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: toolchain-${{ matrix.image_suffix }}
          path: toolchain/${{ matrix.image_suffix }}.txt
          retention-days: 14
          if-no-files-found: error

      - name: Tag image for push
        run: |
          set -euo pipefail
          docker tag "${{ matrix.test_image }}" "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      - name: Trivy vulnerability scan
        id: trivy
        # SHA-pinned: trivy-action tags were force-pushed to a credential-stealing
        # commit in March 2026 (GHSA-69fq-xp46-6x23). Runs between the Docker Hub logins.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "false"
          image-ref: "${{ matrix.test_image }}"
          # The reviewed action revision defaults to Trivy v0.70.0.
          format: "json"
          output: "trivy-${{ matrix.image_suffix }}.json"
          exit-code: "1"
          ignore-unfixed: true
          # Source secrets and misconfiguration are gated in ci.yml.
          scanners: "vuln"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          timeout: "10m"
          trivyignores: ".trivyignore"

      # Scanner failure (exit 1 here, no valid report) and findings (valid report,
      # counts > 0; the scan step above already failed the job) are reported separately.
      # "0 findings" appears only for a report that proves an OS target was scanned.
      - name: Generate Trivy summary (${{ matrix.arch }})
        if: ${{ !cancelled() && steps.trivy.conclusion != 'skipped' }}
        env:
          ARCH: ${{ matrix.image_suffix }}
          TEST_IMAGE: ${{ matrix.test_image }}
        run: |
          set -euo pipefail
          if ! python3 tools/trivy-report.py summary "trivy-${ARCH}.json" "$ARCH" \
              --expect-ref "$TEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"; then
            echo "### Trivy (${ARCH}): scanner failure, no valid report for ${TEST_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload Trivy findings (${{ matrix.arch }})
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-findings-${{ matrix.image_suffix }}
          path: trivy-${{ matrix.image_suffix }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push arch-specific image
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}"

      # The manifest is built from digests, not mutable arch tags that are
      # deleted afterwards. cleanup-arch-tags derives the fragment tags from the
      # version and the matrix, so a failure here still gets cleaned up.
      - name: Record image digest
        run: |
          set -euo pipefail
          mkdir -p digests

          digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${VERSION}-${{ matrix.image_suffix }}" \
            --format '{{.Manifest.Digest}}')"

          case "$digest" in
            sha256:*) ;;
            *)
              echo "ERROR: unexpected digest for ${{ matrix.image_suffix }}: '${digest}'"
              exit 1
              ;;
          esac

          printf '%s' "$digest" > "digests/${{ matrix.image_suffix }}"
          echo "${{ matrix.image_suffix }} -> ${digest}"

      - name: Upload image digest (${{ matrix.arch }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-digest-${{ matrix.image_suffix }}
          path: digests/${{ matrix.image_suffix }}
          retention-days: 1
          if-no-files-found: error

  create-manifest:
    name: Create multi-arch manifest
    needs: [meta, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CANDIDATE_TAG: ${{ needs.meta.outputs.candidate_tag }}
      IMAGE_NAME: ${{ format('{0}/justup', secrets.DOCKERHUB_USERNAME) }}
      MOVES_LATEST: ${{ needs.meta.outputs.moves_latest }}
      EXPECTED_ARCHS: ${{ needs.meta.outputs.archs }}
      NMAP_VERSION: ${{ needs.meta.outputs.nmap_version }}
      NMAP_SOURCE_SHA256: ${{ needs.meta.outputs.nmap_source_sha256 }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Download toolchain versions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: toolchain-*
          path: toolchain/
          merge-multiple: true

      # Expected architectures come from the matrix, never from what arrived: a
      # lost artifact must stop the release. merge-multiple overwrites duplicates
      # silently, so the files are compared as exact sets.
      - name: Verify digest and toolchain files match the build matrix
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_ARCHS// /}" ]]; then
            echo "ERROR: meta job declared no architectures"
            exit 1
          fi
          expected="$(tr ' ' '\n' <<< "$EXPECTED_ARCHS" | sort)"
          if [[ -n "$(uniq -d <<< "$expected")" ]]; then
            echo "ERROR: duplicate architecture in the matrix: ${EXPECTED_ARCHS}"
            exit 1
          fi
          shopt -s nullglob
          digest_files=(digests/*)
          toolchain_files=(toolchain/*)
          found_digests="$( (( ${#digest_files[@]} )) && printf '%s\n' "${digest_files[@]##*/}" | sort || true)"
          found_toolchain="$( (( ${#toolchain_files[@]} )) && printf '%s\n' "${toolchain_files[@]##*/}" | sed 's/\.txt$//' | sort || true)"
          if [[ "$found_digests" != "$expected" ]]; then
            echo "ERROR: digest files [$(tr '\n' ' ' <<< "$found_digests")] differ from the build matrix [${EXPECTED_ARCHS}]"
            exit 1
          fi
          if [[ "$found_toolchain" != "$expected" ]]; then
            echo "ERROR: toolchain files [$(tr '\n' ' ' <<< "$found_toolchain")] differ from the build matrix [${EXPECTED_ARCHS}]"
            exit 1
          fi
          for file in "${digest_files[@]}"; do
            if ! grep -qE '^sha256:[0-9a-f]{64}$' "$file"; then
              echo "ERROR: ${file} does not contain a sha256 digest"
              exit 1
            fi
          done
          echo "OK: digests and toolchain manifests exist for exactly: ${EXPECTED_ARCHS}"

      # Parity gate: runs before any index exists, so a mismatch or an incomplete
      # manifest (required fields, every direct dependency) stops the publish.
      - name: Verify architectures carry identical versions
        run: python3 tools/toolchain-parity.py toolchain --pyproject pyproject.toml

      # Parity proves the architectures agree; this proves they carry the one version meta resolved.
      - name: Verify every architecture carries the resolved Nmap version
        run: |
          set -euo pipefail
          for file in toolchain/*.txt; do
            grep -qxF "nmap=${NMAP_VERSION}" "$file" || { echo "ERROR: ${file} lacks nmap=${NMAP_VERSION}" >&2; exit 1; }
            grep -qxF "nmap_source_sha256=${NMAP_SOURCE_SHA256}" "$file" || { echo "ERROR: ${file} lacks the resolved Nmap source hash" >&2; exit 1; }
          done

      # Candidate first: the index is built from the pushed digests under a run-specific
      # temporary tag, so a failed verification never touches a public version tag.
      - name: Create candidate index
        run: |
          set -euo pipefail

          # One file per architecture, named after it, holding its digest (set verified above).
          digest_files=(digests/*)

          declare -a sources=()
          echo "Assembling index from:"
          for file in "${digest_files[@]}"; do
            digest="$(tr -d '[:space:]' < "$file")"
            sources+=("${IMAGE_NAME}@${digest}")
            echo "  linux/$(basename "$file")  ${digest}"
          done

          docker buildx imagetools create --tag "${IMAGE_NAME}:${CANDIDATE_TAG}" "${sources[@]}"
          echo "Pushed candidate: ${IMAGE_NAME}:${CANDIDATE_TAG}"

      # imagetools create only confirms the registry accepted the index. Check
      # that it lists the expected platforms with the digests that were scanned and pushed.
      - name: Verify candidate index
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${CANDIDATE_TAG}" > manifest-candidate.json
          python3 tools/verify-manifest.py verify manifest-candidate.json digests

          index_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${CANDIDATE_TAG}" \
            --format '{{.Manifest.Digest}}')"
          case "$index_digest" in
            sha256:*) ;;
            *) echo "ERROR: could not resolve the digest of ${IMAGE_NAME}:${CANDIDATE_TAG}"; exit 1 ;;
          esac
          echo "INDEX_DIGEST=${index_digest}" >> "$GITHUB_ENV"

      # Only the verified index digest is published; nothing is rebuilt or re-resolved.
      # A published version tag is immutable: if it exists, this run may only confirm it
      # (its platform digests equal the ones built here); a rebuild with newly resolved
      # components must ship as a new version, never overwrite the tag.
      - name: Publish version tag
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          state="$(python3 tools/dockerhub.py exists "$VERSION")"
          if [[ "$state" == "present" ]]; then
            docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" > manifest-existing.json
            if ! python3 tools/verify-manifest.py verify manifest-existing.json digests; then
              echo "ERROR: ${IMAGE_NAME}:${VERSION} is already published with different content." >&2
              echo "A version tag is immutable. Release the changed components as a new justUp version." >&2
              exit 1
            fi
            existing_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
              --format '{{.Manifest.Digest}}')"
            case "$existing_digest" in
              sha256:*) ;;
              *) echo "ERROR: could not resolve the digest of ${IMAGE_NAME}:${VERSION}" >&2; exit 1 ;;
            esac
            echo "INDEX_DIGEST=${existing_digest}" >> "$GITHUB_ENV"
            echo "Confirmed: ${IMAGE_NAME}:${VERSION} already carries these images (${existing_digest}); not republished"
            exit 0
          fi
          if [[ "$state" != "absent" ]]; then
            echo "ERROR: unexpected tag state '${state}'" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}@${INDEX_DIGEST}"
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" > manifest-version.json
          python3 tools/verify-manifest.py verify manifest-version.json digests
          echo "Pushed manifest: ${IMAGE_NAME}:${VERSION} -> ${INDEX_DIGEST}"

      # 'latest' moves only after the candidate passed verification, and only for the
      # newest stable release (moves_latest). It points at the same verified digest.
      - name: Promote latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *-* ]]; then
            echo "Skipping 'latest': ${VERSION} is a prerelease"
            exit 0
          fi
          if [[ "$MOVES_LATEST" != "true" ]]; then
            echo "Skipping 'latest': a newer stable version is already published"
            exit 0
          fi

          # The meta decision may be hours old: re-read the registry right before moving 'latest'.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          python3 tools/dockerhub.py list > "$work/tags.txt"
          # shellcheck disable=SC2086 # EXPECTED_ARCHS is a space-separated list
          python3 tools/release-newest.py "$work/tags.txt" "$VERSION" $EXPECTED_ARCHS > "$work/decision.txt"
          if ! grep -qxF 'moves_latest=true' "$work/decision.txt"; then
            echo "ERROR: a newer stable release was published since the start of this run; 'latest' stays put." >&2
            exit 1
          fi

          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${INDEX_DIGEST}"
          echo "Pushed manifest: ${IMAGE_NAME}:latest -> ${INDEX_DIGEST}"

          docker buildx imagetools inspect --raw "${IMAGE_NAME}:latest" > manifest-latest.json
          python3 tools/verify-manifest.py verify manifest-latest.json digests

  # always(): a failed or cancelled build or manifest leaves temporary tags on Docker
  # Hub that nothing else would remove. The tags are derived from the version, the
  # matrix architectures and this run (fragments <version>-<arch>, the run-specific
  # candidate), never from artifacts that a failed upload could have lost. A tag that
  # does not exist is fine; any other deletion error fails the job and stays visible.
  cleanup-arch-tags:
    name: Remove temporary tags (fragments, candidate)
    needs: [meta, build, create-manifest]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Delete temporary tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          CANDIDATE_TAG: ${{ needs.meta.outputs.candidate_tag }}
          ARCHS: ${{ needs.meta.outputs.archs }}
        run: |
          set -euo pipefail

          # meta may have failed or been skipped: no version, nothing pushed.
          if [[ -z "$VERSION" || -z "$CANDIDATE_TAG" || -z "${ARCHS// /}" ]]; then
            echo "No version resolved - nothing to clean up."
            exit 0
          fi

          read -ra archs <<< "$ARCHS"
          tags=("$CANDIDATE_TAG")
          for arch in "${archs[@]}"; do
            tags+=("${VERSION}-${arch}")
          done
          echo "Deleting temporary tags (if present): ${tags[*]}"
          python3 tools/dockerhub.py delete "${tags[@]}"

  # DESTRUCTIVE: deletes every tag except the current version and 'latest'
  # (irreversible on Docker Hub), so it needs a verified manifest and is_newest:
  # an older re-run must not delete the releases that came after it. Runs after
  # the fragment cleanup so the two do not race on the same arch tags. A failure
  # turns the workflow red but does not block the GitHub release.
  cleanup-dockerhub-tags:
    name: Keep only latest and current version tag
    needs: [meta, create-manifest, cleanup-arch-tags]
    if: >-
      needs.create-manifest.result == 'success' &&
      needs.cleanup-arch-tags.result == 'success' &&
      needs.meta.outputs.is_newest == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Delete all non-current Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          ARCHS: ${{ needs.meta.outputs.archs }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          echo "Keeping Docker Hub tags: ${VERSION} latest"

          # The complete listing is read first; a failed page exits before anything is deleted.
          python3 tools/dockerhub.py list > "$work/before.txt"

          # The meta decision may be hours old: re-check against this fresh listing before deleting.
          # shellcheck disable=SC2086 # ARCHS is a space-separated list
          python3 tools/release-newest.py "$work/before.txt" "$VERSION" $ARCHS > "$work/decision.txt"
          if ! grep -qxF 'is_newest=true' "$work/decision.txt"; then
            echo "ERROR: a newer release was published since the start of this run; nothing is deleted." >&2
            exit 1
          fi

          # Release policy: keep the current version and 'latest', delete the rest.
          # grep exits 1 when nothing is left to delete, which is fine.
          grep -vxF -e "$VERSION" -e latest "$work/before.txt" > "$work/stale.txt" || [[ $? -eq 1 ]]
          mapfile -t stale_tags < "$work/stale.txt"
          if (( ${#stale_tags[@]} > 0 )); then
            python3 tools/dockerhub.py delete --verify "${stale_tags[@]}"
          fi

          # Re-list: only the kept tags may remain, and they must still exist.
          python3 tools/dockerhub.py list > "$work/after.txt"
          grep -vxF -e "$VERSION" -e latest "$work/after.txt" > "$work/unexpected.txt" || [[ $? -eq 1 ]]
          if [[ -s "$work/unexpected.txt" ]]; then
            echo "ERROR: unexpected tags remained after cleanup:"
            cat "$work/unexpected.txt"
            exit 1
          fi

          # Prereleases never publish 'latest' (see create-manifest).
          expected_tags=("$VERSION")
          if [[ "$VERSION" != *-* ]]; then
            expected_tags+=(latest)
          fi
          for tag in "${expected_tags[@]}"; do
            if ! grep -qxF "$tag" "$work/after.txt"; then
              echo "ERROR: expected tag missing after cleanup: $tag"
              exit 1
            fi
          done

  create-release:
    name: Create GitHub Release
    # Documents the verified manifest. Deliberately not after cleanup-dockerhub-tags:
    # tag pruning failing must not hide an already published, verified release.
    needs: [meta, create-manifest]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/justup', secrets.DOCKERHUB_USERNAME) }}
      MOVES_LATEST: ${{ needs.meta.outputs.moves_latest }}
      ARCHS: ${{ needs.meta.outputs.archs }}
      NMAP_VERSION: ${{ needs.meta.outputs.nmap_version }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download Trivy findings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: trivy-findings-*
          path: trivy-reports/
          merge-multiple: false

      # Per-release record of the installed dependency set (also attached to the release).
      - name: Download toolchain versions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: toolchain-*
          path: toolchain/
          merge-multiple: true

      - name: Download Nmap provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: nmap-provenance-*
          path: nmap-provenance/
          merge-multiple: true

      # The release body links to the reports: each must exist and be a valid report
      # of a recognized image (tools/trivy-report.py) before a public release is created.
      - name: Validate Trivy findings
        run: |
          set -euo pipefail
          read -ra archs <<< "$ARCHS"
          for arch in "${archs[@]}"; do
            report="trivy-reports/trivy-findings-${arch}/trivy-${arch}.json"
            python3 tools/trivy-report.py status "$report" > "${RUNNER_TEMP}/trivy-status-${arch}.txt"
            echo "${arch}: $(cat "${RUNNER_TEMP}/trivy-status-${arch}.txt")"
          done

      - name: Create or update GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const version = process.env.VERSION;
            const imageName = process.env.IMAGE_NAME;
            const nmapVersion = process.env.NMAP_VERSION;
            const isPrerelease = version.includes('-');
            // Mirrors create-manifest: do not document a 'latest' this run left alone.
            const movedLatest = !isPrerelease && process.env.MOVES_LATEST === 'true';
            const tagName = 'v' + version;
            const archs = process.env.ARCHS.split(' ');

            // Written by the previous step (tools/trivy-report.py status); one line per architecture.
            function trivyStatus(arch) {
              return fs.readFileSync(path.join(process.env.RUNNER_TEMP, `trivy-status-${arch}.txt`), 'utf8').trim();
            }

            function extractVersionSection(markdown, targetVersion) {
              const headingPattern = /^## \[([^\]]+)\] - .+$/gm;
              let startIndex = -1;
              let endIndex = markdown.length;
              let match;

              while ((match = headingPattern.exec(markdown)) !== null) {
                if (startIndex === -1 && match[1] === targetVersion) {
                  startIndex = match.index;
                  continue;
                }
                if (startIndex !== -1) {
                  endIndex = match.index;
                  break;
                }
              }

              if (startIndex === -1) {
                return null;
              }
              // The changelog wraps older entries in <details>; drop that markup from the notes.
              return markdown.slice(startIndex, endIndex)
                .replace(/<details[^>]*>\s*<summary>.*?<\/summary>/gs, '')
                .replace(/<\/details>/g, '')
                .trim();
            }

            // A missing section has a defined fallback text; an unreadable CHANGELOG.md fails the job.
            const changelogSection = extractVersionSection(fs.readFileSync('CHANGELOG.md', 'utf8'), version);
            if (!changelogSection) {
              console.log('No matching changelog section found for version ' + version);
            }

            const tags = [
              '- `' + imageName + ':' + version + '` (multi-arch)'
            ];
            if (movedLatest) {
              tags.push('- `' + imageName + ':latest` (multi-arch)');
            } else if (!isPrerelease) {
              tags.push('- `' + imageName + ':latest` was left on a newer release');
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Reports are attached to the release below because run artifacts expire.
            const assetBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}`;
            const trivyRows = archs.map(arch =>
              `| ${arch} | ${trivyStatus(arch)} | [trivy-${arch}.json](${assetBase}/trivy-${arch}.json) |`);

            // The release title already carries the version, so the body starts with the image.
            const body = [
              '**Docker Image:** `docker pull ' + imageName + ':' + version + '`',
              '**Nmap:** ' + nmapVersion + ' (verified upstream release)',
              '',
              '### Available Tags',
              ...tags,
              '',
              '### Security Scan Results',
              '',
              '| Architecture | Status | Findings |',
              '|---|---|---|',
              ...trivyRows,
              '| run | workflow details | [Actions Run](' + runUrl + ') |',
              '',
              '> Scanned with [Trivy](https://trivy.dev/) for HIGH and CRITICAL severity vulnerabilities (unfixed CVEs ignored).',
              '',
              '### Changelog',
              changelogSection || '_No matching CHANGELOG entry found for this version._',
              '',
              '**Source:** [justUp! Repository](https://github.com/' + context.repo.owner + '/' + context.repo.repo + ')'
            ].join('\n');

            const releaseFields = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: 'justUp! ' + version,
              body: body,
              draft: false,
              prerelease: isPrerelease
            };

            // Look up first instead of treating every 422 as "already exists".
            let release = null;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              }));
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (release) {
              ({ data: release } = await github.rest.repos.updateRelease({
                ...releaseFields,
                release_id: release.id
              }));
              console.log('Updated release ' + tagName);
            } else {
              ({ data: release } = await github.rest.repos.createRelease(releaseFields));
              console.log('Created release ' + tagName);
            }

            // Attach the scan reports and the installed-dependency manifests (the release body links to
            // the reports; run artifacts expire). Any failure here fails the job.
            const assets = archs.flatMap(arch => [
              [`trivy-${arch}.json`, path.join('trivy-reports', `trivy-findings-${arch}`, `trivy-${arch}.json`), 'application/json'],
              [`toolchain-${arch}.txt`, path.join('toolchain', `${arch}.txt`), 'text/plain'],
              [`nmap-provenance-${arch}.txt`, path.join('nmap-provenance', `nmap-provenance-${arch}.txt`), 'text/plain'],
            ]);
            for (const [assetName, file, contentType] of assets) {
              const data = fs.readFileSync(file);
              const existing = (release.assets || []).find(a => a.name === assetName);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existing.id
                });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: assetName,
                data: data,
                headers: {
                  'content-type': contentType,
                  'content-length': data.length
                }
              });
              console.log('Attached ' + assetName);
            }
