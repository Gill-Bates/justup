# .github/workflows/ci.yml
# Copyright (C) 2026 Gill-Bates http://github.com/Gill-Bates
#
# CI runs on every branch push and on pull requests targeting main. The release
# workflow also calls it for the tagged commit. It runs the code quality, test,
# container, browser, workflow and manifest checks.
#

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # The release workflow calls this as its gate, independent of push and PR filters.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Ruff + pytest
    # Every job here names its image instead of following ubuntu-latest, which
    # moves x64 runners to Ubuntu 26.04 in a gradual rollout from 2026-10-19 to
    # 2026-11-19 (actions/runner-images#14748) - weeks in which two runs of one
    # commit could disagree about the OS. Taking 26.04 now rather than being
    # taken there keeps the image a reviewable line instead of a date.
    #
    # Nothing here depends on the host's pre-cached toolchains: Python comes
    # from setup-python, which publishes 26.04 builds.
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Matches requires-python in pyproject.toml and the python:3.13-slim
          # stages in docker/Dockerfile.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docker/requirements.lock

      # The tests import app/, so the runtime stack has to be present too. It is
      # installed exactly like the Docker image: the complete hash-pinned
      # docker/requirements.lock, wheels only (no sdist build, no build backend
      # download), with the vendored SSLyze wheel from docker/vendor/wheels/ found
      # through --find-links and verified by its lock hash. The runner's own pip
      # (setup-python) is used as is; it is only the installer.
      #
      # The project itself is not installed; pytest imports app/ from the
      # checkout root, so these gates exercise the checked-out source.
      - name: Vendored SSLyze wheel preflight
        run: |
          set -euo pipefail
          wheel="$(python -c 'import json; print(json.load(open("docker/vendor/PROVENANCE.json"))["wheel"])')"
          git ls-files --error-unmatch -- "$wheel"
          actual="$(sha256sum -- "$wheel" | cut -d' ' -f1)"
          python - "$wheel" "$actual" <<'PY'
          import json, os, re, sys
          wheel, actual = sys.argv[1:]
          prov = json.load(open("docker/vendor/PROVENANCE.json"))
          lock = open("docker/requirements.lock").read().replace("\\\n", " ")
          pin = re.search(r"^sslyze==(\S+)\s+--hash=sha256:([0-9a-f]{64})\s*$", lock, re.M)
          assert pin, "sslyze pin missing from docker/requirements.lock"
          expected_name = f"sslyze-{prov['version']}-{prov['tags']}.whl"
          assert os.path.basename(wheel) == expected_name, (wheel, expected_name)
          assert pin.group(1) == prov["version"], (pin.group(1), prov["version"])
          assert actual == prov["sha256"] == pin.group(2), (actual, prov["sha256"], pin.group(2))
          assert os.path.getsize(wheel) == prov["size_bytes"], os.path.getsize(wheel)
          PY
      - name: Install runtime dependencies (locked)
        run: |
          set -euo pipefail
          pip install --require-hashes --only-binary=:all: \
            --find-links docker/vendor/wheels -r docker/requirements.lock

      # Dev tools are a separate, deliberate step: pyproject.toml pins them with
      # == (tools/pyproject-deps.py keeps that list in one place). Wheels only, so
      # none of them builds from source. The runtime set above is not touched.
      - name: Install dev tools (pinned)
        run: |
          set -euo pipefail
          python tools/pyproject-deps.py dev > "$RUNNER_TEMP/requirements-dev.txt"
          cat "$RUNNER_TEMP/requirements-dev.txt"
          pip install --only-binary=:all: -r "$RUNNER_TEMP/requirements-dev.txt"
          pip check

      # The image builds for both architectures from this one lock. Resolve every
      # locked file for linux/arm64 and linux/amd64 (hash-checked, no deps, no
      # build) so a missing wheel or a wrong hash fails here, not in the release.
      # The loop values are wheel platform tags (x86_64, aarch64), not the build-matrix
      # names in docker-build.yml (amd64, arm64); a deliberate second list, see workflows/AGENTS.md.
      - name: Locked wheels exist for amd64 and arm64
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            pip download --quiet --dest "$RUNNER_TEMP/wheels-${arch}" --no-deps --require-hashes \
              --only-binary=:all: --find-links docker/vendor/wheels \
              --python-version 3.13 --implementation cp --abi cp313 --abi abi3 --abi none \
              --platform "manylinux_2_28_${arch}" --platform "manylinux_2_17_${arch}" \
              --platform "manylinux2014_${arch}" --platform any \
              -r docker/requirements.lock
            echo "${arch}: $(find "$RUNNER_TEMP/wheels-${arch}" -name '*.whl' | wc -l) wheels"
          done

      # pyproject.toml <-> lock <-> vendored wheel metadata, SHA-256 and the
      # forbidden-source rules live in tests/test_dependency_lock.py; run first so
      # a supply-chain drift is named before the broad suite starts.
      - name: Dependency lock consistency
        run: pytest tests/test_dependency_lock.py -q

      # The full rule set configured in pyproject.toml, blocking. The tree was
      # brought to zero findings before this became a gate; the deliberate
      # exemptions live in pyproject.toml with the reasoning next to each one
      # (probe subprocesses and typographic punctuation),
      # and narrower cases carry a per-line `# noqa` naming the reason.
      #
      # Prefer fixing over exempting. If a new finding really does not apply,
      # annotate the line rather than widening the ignore list, so the next
      # reader can tell a decision from a blanket.
      - name: Ruff
        run: ruff check --output-format=github .

      # The tree is formatted with `ruff format` (space indent, see pyproject.toml);
      # keep it that way.
      - name: Ruff format
        run: ruff format --check --diff .

      - name: Layout stub cleanup regression
        run: |
          set -euo pipefail
          pytest -q --junitxml="$RUNNER_TEMP/layout-stub-cleanup.xml" tests/test_layout_stub_cleanup.py
          python - "$RUNNER_TEMP/layout-stub-cleanup.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          cases = ElementTree.parse(sys.argv[1]).findall(".//testcase")
          if len(cases) != 1 or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("layout stub cleanup test was skipped or not collected")
          PY

      # Unit tests set their own environment; no production encryption key is
      # supplied to the PR gate. Tests are independent (own tmp_path, ephemeral
      # ports), so pytest-xdist spreads them over one worker per runner core.
      - name: pytest
        run: pytest -n auto

  container:
    name: Dockerfile + entrypoint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The image is only ever built from a release tag, so without these two
      # steps a broken entrypoint or Dockerfile stays invisible until the
      # release itself. The full multi-arch build is far too slow for a PR;
      # these are the cheap half that still catches a typo.
      #
      # The entrypoint uses Bash syntax. -n parses without executing it.
      - name: Entrypoint shell syntax
        run: |
          bash -n docker/entrypoint.sh
          bash -n docker/nmap-worker.sh

      - name: Entrypoint shellcheck
        run: shellcheck docker/entrypoint.sh docker/nmap-worker.sh

      # BuildKit checks the justUp image stages and COPY targets without
      # running the build.
      - name: Dockerfile check
        run: docker build --check -f docker/Dockerfile .

  frontend:
    name: ESLint + Stylelint + node:test
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install tooling
        run: npm ci --ignore-scripts

      - name: Lint (ESLint, Stylelint)
        run: npm run lint

      - name: node:test
        run: npm test

  browser:
    name: Chromium + WebKit UI regressions
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      JUSTUP_LAYOUT_PROFILE: quick
      # The shell viewport matrix needs both engines (DESIGN.md); Playwright fails if either cannot launch.
      JUSTUP_LAYOUT_BROWSERS: chromium,webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docker/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install runtime dependencies (locked)
        run: |
          set -euo pipefail
          pip install --require-hashes --only-binary=:all: \
            --find-links docker/vendor/wheels -r docker/requirements.lock

      - name: Install dev tools
        run: |
          set -euo pipefail
          python tools/pyproject-deps.py dev > "$RUNNER_TEMP/requirements-dev.txt"
          pip install --only-binary=:all: -r "$RUNNER_TEMP/requirements-dev.txt"
          pip check

      - name: Install frontend tools
        run: npm ci --ignore-scripts

      - name: Install Chromium, WebKit and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run sidebar transition browser checks
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep @sidebar

      - name: Run notification dropdown browser checks
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
          JUSTUP_NOTIFICATION_DROPDOWN_SHOTS: ${{ runner.temp }}/notification-dropdown/screenshots
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep @notification-dropdown

      - name: List notification, wizard and SMTP browser tests
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
          PLAYWRIGHT_LIST: ${{ runner.temp }}/notification-wizard-smtp.json
        run: |
          set -euo pipefail
          npx playwright test --config tests/layout/playwright.config.mjs --list --reporter=json --grep '@notifications|@wizard|@smtp-ui' > "$PLAYWRIGHT_LIST"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import path from "node:path";
            const report = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const actual = new Set(report.suites.map((suite) => path.basename(suite.file)));
            const expected = ["notifications.spec.mjs", "wizard.spec.mjs", "smtp.spec.mjs"];
            const missing = expected.filter((file) => !actual.has(file));
            const unexpected = [...actual].filter((file) => !expected.includes(file));
            if (missing.length || unexpected.length || actual.size !== expected.length) {
              console.error(JSON.stringify({ missing, unexpected, actual: [...actual] }, null, 2));
              process.exit(1);
            }
          ' "$PLAYWRIGHT_LIST"

      - name: Run notification, wizard and SMTP browser checks
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
          JUSTUP_LAYOUT_JUNIT: ${{ runner.temp }}/notification-wizard-smtp.xml
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep '@notifications|@wizard|@smtp-ui'

      - name: Run strict Chromium browser checks
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
          JUSTUP_LAYOUT_JUNIT: ${{ runner.temp }}/browser-tests.xml
        run: |
          set -euo pipefail
          node tests/layout/run.mjs --gridstack
          pytest -q --junitxml="$RUNNER_TEMP/browser-python-tests.xml" \
            tests/test_ui_layout_contract.py tests/test_modal_dismissal.py

      - name: Run modal browser checks
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
          JUSTUP_LAYOUT_JUNIT: ${{ runner.temp }}/modal-browser-tests.xml
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep @modal

      - name: Run chart, recipient, route map, confirm dialog, target form and other browser checks (Chromium + WebKit)
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium,webkit
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep '@combined-zoom-reset|@public-hostname-ui|@target-endpoints|@portpicker|@endpoint-state|@combined-legend|@recipients-search|@recipient-channels|@recipient-signal-recheck|@traceroute-map|@reset-confirm|@availability-clip|@targets-live-update|@smtp-link-field|@spooler-log|@combined-note|@edit-target-save|@network-diagnostics-layout|@public-egress|@service-detection|@downtime-widget-link'
      # These specs guard tab presses, edit-target tabs, load stability, card corners and overlays, chart clipping, the downtime card and dashboard metric labels.
      - name: Run tab, load stability, card, chart clip, downtime and dashboard metric browser checks (Chromium + WebKit)
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium,webkit
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep '@settings-tab-press|@edit-target-tabs|@load-stability|@card-corners|@card-overlays|@combined-clip|@downtime-history|@dashboard-metrics'

      - name: Run focus, cursor and targets search browser checks
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium,webkit
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
        run: node tests/layout/run.mjs --focus

      - name: Run browser authentication flow
        env:
          JUSTUP_LAYOUT_BROWSERS: chromium
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep @auth

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-tests
          path: |
            ${{ runner.temp }}/browser-tests.xml
            ${{ runner.temp }}/browser-python-tests.xml
            ${{ runner.temp }}/notification-wizard-smtp.xml
            ${{ runner.temp }}/modal-browser-tests.xml
            ${{ runner.temp }}/layout-artifacts/
            ${{ runner.temp }}/notification-dropdown/
          retention-days: 7
          if-no-files-found: warn

  # The strict shell viewport matrix (@layout plus the audit self-test, Chromium + WebKit) is split into two
  # shards. Playwright distributes the individual tests, so every test runs in exactly one shard. Both shards
  # are required checks: "Browser matrix (shard 1/2)" and "Browser matrix (shard 2/2)".
  browser-matrix:
    name: Browser matrix (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JUSTUP_LAYOUT_PROFILE: quick
      JUSTUP_LAYOUT_BROWSERS: chromium,webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docker/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install runtime dependencies (locked)
        run: |
          set -euo pipefail
          pip install --require-hashes --only-binary=:all: \
            --find-links docker/vendor/wheels -r docker/requirements.lock

      - name: Install frontend tools
        run: npm ci --ignore-scripts

      - name: Install Chromium, WebKit and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run strict shell viewport matrix (Chromium + WebKit, shard ${{ matrix.shard }}/2)
        env:
          JUSTUP_LAYOUT_OUTPUT: ${{ runner.temp }}/layout-artifacts
          JUSTUP_LAYOUT_JUNIT: ${{ runner.temp }}/browser-shell-${{ matrix.shard }}.xml
        run: npx playwright test --config tests/layout/playwright.config.mjs --grep '@layout|@audit-self-test' --shard=${{ matrix.shard }}/2

      - name: Upload browser matrix report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-matrix-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-shell-${{ matrix.shard }}.xml
            ${{ runner.temp }}/layout-artifacts/
          retention-days: 7
          if-no-files-found: warn

  manifest:
    name: pyproject.toml is the only manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # VERSION, requirements.txt and docs/requirements-docs.txt were folded
      # into pyproject.toml (see the comment at the top of it). Reintroducing
      # any of them would give the release workflow, the running container and
      # the docs build two versions to disagree about.
      - name: Reject reintroduced manifests
        run: |
          set -euo pipefail
          failed=0
          for stale in VERSION requirements.txt docs/requirements-docs.txt; do
            if [ -e "$stale" ]; then
              echo "ERROR: $stale is back - pyproject.toml is the single manifest"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      # docker-build.yml rejects a version this check would not accept, but it
      # only runs once the tag is already pushed - and a tag is not retractable
      # in the same way a commit is. Same regex as the release workflow's, kept
      # strict to X.Y.Z with an optional prerelease suffix.
      - name: Version is release-shaped
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "pyproject.toml version: ${VERSION}"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

  workflows:
    name: Workflow lint (actionlint + shellcheck)
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # actionlint runs shellcheck over every inline `run:` block when the
      # binary is on PATH, and silently skips it otherwise. Failing here keeps
      # that half of the gate from disappearing unnoticed with a runner image.
      - name: shellcheck is available
        run: command -v shellcheck && shellcheck --version

      # Exact release plus its published sha256 keeps workflow lint repeatable.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -version

      - name: actionlint
        run: ./actionlint -color

  source-scan:
    name: Source secrets + misconfiguration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      TRIVY_VERSION: "0.70.0"
      TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Use the official release asset directly; setup-trivy's bootstrap failed after resolving the tag.
      - name: Install checksum-verified Trivy
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          binary_dir="$RUNNER_TEMP/trivy-bin"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$binary_dir"
          tar -xzf "$archive" -C "$binary_dir" trivy
          echo "$binary_dir" >> "$GITHUB_PATH"
          "$binary_dir/trivy" --version

      # The release image scan owns vulnerabilities. Scan our checked-out
      # source here for secrets and infrastructure misconfiguration.
      - name: Trivy source scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "false"
          version: "v0.70.0"
          skip-setup-trivy: "true"
          scan-type: "fs"
          scan-ref: "."
          scanners: "secret,misconfig"
          # Local caches and vendored assets are not authored in this repository.
          skip-dirs: ".git,.venv,venv,__pycache__,data,site,app/static/vendor"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          timeout: "5m"
          trivyignores: ".trivyignore.yaml"
