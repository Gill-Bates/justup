export TRACKING_API_SECRET="***"
export TRACKING_ADMIN_PASS="strong-password"
docker compose up -d


# Build Tracking Docker Image
cd /opt/justup-dev && \
VERSION="$(cat VERSION | tr -d '\r\n')" && \

if [ -z "$VERSION" ]; then echo "VERSION is empty" >&2; exit 1; fi && \
cd /opt/justup-dev/tracking && \
docker buildx build \
  --builder justup-builder \
  --platform linux/amd64 \
  --network=host \
  --build-arg APP_VERSION="$VERSION" \
  -t docker.cirrio.de/justup-tracking:latest \
  --push .

# Container neu starten
docker compose down && docker compose pull && docker compose up -d