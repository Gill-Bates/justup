# Setup (prefer Python 3.13 to match Docker runtime-python image)
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/justup-dev/.venv
source /opt/justup-dev/.venv/bin/activate

pip install --upgrade pip
pip install -r /opt/justup-dev/requirements.txt

# Start local Dev Server
export UPMON_ENCRYPTION_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
export LOG_LEVEL="DEBUG"
export UPMON_ADMIN_PASSWORD="admin"
source .venv/bin/activate && JUSTUP_CYTHON_STRICT_PYTHON=0 python docker/setup_cython.py build_ext --inplace
cd /opt/justup-dev && source .venv/bin/activate && python -m app
 
# Docker
docker login docker.cirrio.de
docker login # Docker Hub

# Setup Buildx
docker buildx inspect justup-builder >/dev/null 2>&1 || docker buildx create --name justup-builder --use --driver docker-container
docker buildx inspect justup-builder --bootstrap

# Build Image
VERSION="$(tr -d '\r\n' < VERSION)"
git rev-parse HEAD > BUILD_INFO

# docker.cirrio.de (Local build: amd64 only; arm64 only in GitHub Actions)
cd /opt/justup-dev && \
docker buildx build \
  --builder justup-builder \
  --platform linux/amd64 \
  --network=host \
  --progress=plain \
  --build-arg APP_VERSION="${VERSION}" \
  --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
  --build-arg VCS_REF="$(cat BUILD_INFO)" \
  -t "docker.cirrio.de/justup:${VERSION}" \
  -t "docker.cirrio.de/justup:latest" \
  --push .

# Live-Logs (optional)
tail -f /tmp/justup-buildx-${VERSION}.log

# Prune Cache
docker buildx prune -af
docker system prune -af

# On the Host
docker compose down && docker compose pull && docker compose up -d

