# =============================================================================
# justUp - Setup & Deployment
# =============================================================================

# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/justup/.venv
source /opt/justup/.venv/bin/activate
pip install --upgrade pip
pip install -r /opt/justup/requirements.txt

# --- Start Dev Server ---
export JUSTUP_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM="
export LOG_LEVEL="DEBUG"
cd /opt/justup && source .venv/bin/activate && python run.py

# --- Docker Login ---
docker login xxx
docker login  # Docker Hub

# --- Build & Push Image ---
cd /opt/justup && \
VERSION="$(cat VERSION | tr -d '\r\n')" && \
if [ -z "$VERSION" ]; then echo "VERSION is empty" >&2; exit 1; fi && \
git add -A && \
git commit -m "Build $VERSION" --allow-empty && \
git rev-parse HEAD > BUILD_INFO && \
docker buildx build --platform linux/amd64 \
  -f docker/Dockerfile \
  -t "docker.cirrio.de/justup:${VERSION}" \
  -t "docker.cirrio.de/justup:latest" \
  --push .

docker compose down && docker compose pull && docker compose up -d

# Prune
docker system prune -af
docker buildx prune -af
