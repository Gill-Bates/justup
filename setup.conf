# =============================================================================
# justUp! - Setup & Deployment
# =============================================================================

# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/justup/.venv
source /opt/justup/.venv/bin/activate
pip install --upgrade pip

# --- Build SSLyze
source /opt/justup/.venv/bin/activate
pip install --find-links /opt/justup/docker/vendor/wheels "sslyze==6.3.1+justup.1"
pip install --find-links /opt/justup/docker/vendor/wheels -e "/opt/justup[dev]"
pip install -e "/opt/justup[dev]"

# --- Start Dev Server ---
# SECRET_KEY is generated per environment and MUST NOT be committed.
# Generate one with: head -c 32 /dev/urandom | base64
export SECRET_KEY="2FOYOTMzLnanxy+lzu3kNpAHJpSUP+KMVpKZHNaFpRA=" # !DEV Dummy Secret! openssl rand -hex 32
export LOG_LEVEL="DEBUG"
export TZ="Europe/Berlin"
cd /opt/justup && source .venv/bin/activate && python run.py

# --- Docker Login ---
docker login 

# --- Build & Push Image ---
PROJECT="justup" && \
REGISTRY="docker.cirrio.de" && \
cd "/opt/${PROJECT}" && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf '%s\n' "$GIT_SHA" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg VCS_REF="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  --label "org.opencontainers.image.version=$VERSION" \
  --label "org.opencontainers.image.revision=$GIT_SHA" \
  --label "org.opencontainers.image.created=$BUILD_DATE" \
  -t "${REGISTRY}/${PROJECT}:${VERSION}" \
  -t "${REGISTRY}/${PROJECT}:latest" \
  --push \
  .

# Local Build
cd /opt/justup

docker build \
  --pull \
  --target runtime \
  -t justup:local \
  -f docker/Dockerfile \
  .

# --- Run Local Container ---
export SECRET_KEY="2FOYOTMzLnanxy+lzu3kNpAHJpSUP+KMVpKZHNaFpRA=" # DEV Dummy Secret!
export LOG_LEVEL="DEBUG"
export TZ="Etc/UTC"

docker run -d --name justup \
  -p 127.0.0.1:8000:8000 \
  -e SECRET_KEY \
  -e LOG_LEVEL \
  -e TZ \
  -v justup-data:/app/data \
  justup:local

# Install Node
curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash

# --- Lint & Test (JS gates) ---
cd /opt/justup
npm ci --ignore-scripts
npm run lint
npm test

# --- Lightpanda ---
curl -fsSL https://pkg.lightpanda.io/install.sh -o /tmp/lightpanda-install.sh
less /tmp/lightpanda-install.sh
bash /tmp/lightpanda-install.sh
export PATH="$HOME/.local/bin:$PATH"
lightpanda version
lightpanda serve --host 127.0.0.1 --port 9222

# --- Full browsers ---
UX_TOOLS_DIR=/opt/ux-test-tools
mkdir -p "$UX_TOOLS_DIR" || exit
cd "$UX_TOOLS_DIR" || exit
[ -f package.json ] || npm init -y
npm install --save --no-package-lock playwright@latest @axe-core/playwright@latest
./node_modules/.bin/playwright install --with-deps chromium webkit firefox

