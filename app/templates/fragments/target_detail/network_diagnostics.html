<div class="target-network-card" id="network-diagnostics" aria-labelledby="target-network-diagnostics-tab" role="region">
	<div id="traceroute-container" data-url="/ui/fragments/traceroute/{{ target.id }}"
		data-cache-user="{{ traceroute_cache_scope.user }}" data-cache-target="{{ traceroute_cache_scope.target }}" data-cache-build="{{ traceroute_cache_scope.build }}" data-cache-geo="{{ traceroute_cache_scope.geo }}">
		<div class="text-center py-4">
			<span class="small text-body-secondary">Select this tab to load network diagnostics.</span>
		</div>
	</div>
</div>
