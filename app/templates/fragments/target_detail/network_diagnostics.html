<div class="target-network-card" id="network-diagnostics" aria-labelledby="target-network-diagnostics-tab" role="region">
	{% if user and user.is_admin %}
	<section id="service-detection" data-target-id="{{ target.id }}" aria-label="Service detection" class="mb-3">
		<button type="button" class="btn btn-outline-secondary" data-service-action="preview">Detect services</button>
		<p class="small text-body-secondary mt-2" data-service-status aria-live="polite"></p>
		<p class="small text-danger" data-service-error role="alert" hidden></p>
		<ul data-service-changes hidden></ul>
		<button type="button" class="btn btn-primary" data-service-action="confirm" hidden>Apply detected changes</button>
	</section>
	{% endif %}
	<div id="traceroute-container" data-url="/ui/fragments/traceroute/{{ target.id }}"
		data-cache-user="{{ traceroute_cache_scope.user }}" data-cache-target="{{ traceroute_cache_scope.target }}" data-cache-build="{{ traceroute_cache_scope.build }}">
		<div class="text-center py-4">
			<span class="small text-body-secondary">Select this tab to load network diagnostics.</span>
		</div>
	</div>
</div>
