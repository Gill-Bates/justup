<div class="card mt-3" data-network-scan-picker data-host-id="{{ scan_host_id }}"
  data-tcp-id="{{ scan_tcp_id }}" data-udp-id="{{ scan_udp_id }}"
  data-tcp-toggle-id="{{ scan_tcp_toggle_id }}" data-udp-toggle-id="{{ scan_udp_toggle_id }}">
  <div class="card-body">
    <h3 class="h6">Port discovery</h3>
    <p class="small text-body-secondary">Scan the host to discover TCP and UDP ports. You can also enter ports manually. Port discovery uses the <a href="https://nmap.org/">Nmap Security Scanner</a>.</p>
    <fieldset class="border-0 p-0 mb-2">
      <legend class="fs-6 mb-1">Protocols to scan</legend>
      <div class="d-flex flex-wrap gap-3">
        <label class="form-check"><input class="form-check-input" type="checkbox" data-scan-protocol="tcp" checked> TCP</label>
        <label class="form-check"><input class="form-check-input" type="checkbox" data-scan-protocol="udp"> UDP</label>
      </div>
    </fieldset>
    <div class="d-flex flex-wrap align-items-end gap-2">
      <div><label class="form-label" for="{{ scan_prefix }}-scan-profile">Scan scope</label>
        <select class="form-select" id="{{ scan_prefix }}-scan-profile" data-scan-profile>
          <option value="quick">Quick scan</option><option value="extended">Extended scan</option>
        </select>
      </div>
      <button class="btn btn-outline-primary" type="button" data-scan-action="start">Scan ports</button>
      <button class="btn btn-outline-secondary" type="button" data-scan-action="cancel" hidden>Cancel scan</button>
    </div>
    <p class="small mt-2 mb-0" id="{{ scan_prefix }}-scan-status" data-scan-status role="status" aria-live="polite"></p>
    <div data-scan-results hidden>
      <div class="table-responsive mt-3" role="region" tabindex="0" aria-label="Discovered ports">
        <table class="table table-sm align-middle mb-0">
          <thead><tr><th scope="col">Select</th><th scope="col">Protocol</th><th scope="col">Port</th><th scope="col">Status</th><th scope="col">Service</th></tr></thead>
          <tbody data-scan-rows></tbody>
        </table>
      </div>
      <div class="d-flex flex-wrap gap-2 mt-2">
        <button class="btn btn-outline-secondary btn-sm" type="button" data-scan-action="select-open">Select all confirmed open ports</button>
        <button class="btn btn-primary btn-sm" type="button" data-scan-action="apply">Add selected ports</button>
      </div>
      <p class="small text-body-secondary mt-2 mb-0">An open|filtered UDP result is uncertain; select it manually if you want to monitor that port.</p>
    </div>
    <input type="hidden" name="network_scan_id" value="">
  </div>
</div>
