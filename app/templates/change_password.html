<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Change password – justUp</title>
	<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
	<link href="/static/css/bootstrap.min.css" rel="stylesheet">
	<link href="/static/css/material-icons.css" rel="stylesheet">
	<link href="/static/css/gentelella-layout.css" rel="stylesheet">
	<link href="/static/css/ui.css" rel="stylesheet">
	<script src="/static/js/theme-init.js"></script>
</head>

<body>
	<main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
		<div class="row w-100 justify-content-center">
			<div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
				<div class="card ju-auth-card">
					<div class="card-body p-4 p-sm-5">
						<div class="text-center mb-4">
							<img src="/static/img/justup_1c.svg" class="ju-logo img-fluid mb-3" alt="justUp!" width="220"
								height="82">
							<h1 class="h4 mb-1">Choose a new password</h1>
							<p class="text-body-secondary small mb-0">
								Signed in as <strong>{{ user.username | e }}</strong>. The current password is
								temporary and must be replaced before you can continue.
							</p>
						</div>
						<div id="error-msg" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
						<form id="change-password-form" aria-label="Change password" novalidate>
							<input type="text" name="username" value="{{ user.username | e }}" autocomplete="username"
								readonly hidden>
							<div class="mb-3">
								<label for="new-password" class="form-label">New password</label>
								<input type="password" class="form-control" id="new-password" name="new_password"
									required minlength="8" maxlength="256" autocomplete="new-password"
									aria-describedby="new-password-help">
								<div id="new-password-help" class="form-text">At least 8 characters, different from the temporary password.</div>
							</div>
							<div class="mb-3">
								<label for="confirm-password" class="form-label">Confirm new password</label>
								<input type="password" class="form-control" id="confirm-password" name="confirm_password"
									required minlength="8" maxlength="256" autocomplete="new-password">
							</div>
							<button type="submit" class="btn btn-primary w-100">
								<span class="material-icons me-1" aria-hidden="true">lock_reset</span> Change password
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	<script src="/static/js/change-password.js"></script>
</body>

</html>
