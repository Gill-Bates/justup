{# Settings: Storage Tab Content #}
<div class="card shadow-sm mb-4">
	<div class="card-body">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h6 class="mb-0">
				<span class="material-icons align-middle me-1" style="font-size: 20px;">storage</span>
				Storage Statistics
			</h6>
			<button type="button" class="btn btn-outline-secondary btn-sm btn-icon"
				hx-get="/ui/fragments/settings-storage" hx-target="#storage-pane" hx-swap="innerHTML" title="Refresh">
				<span class="material-icons" style="font-size: 16px;">refresh</span>
			</button>
		</div>
		<div class="row text-center g-2" id="storage-stats">
			<div class="col-12 col-md-4">
				<div class="border rounded p-3 h-100 d-flex flex-column justify-content-center">
					<div class="text-muted small">SQL Database</div>
					<div class="fs-5 fw-bold text-info">{{ storage.sql_size }}</div>
				</div>
			</div>
			<div class="col-12 col-md-4">
				<div class="border rounded p-3 h-100 d-flex flex-column justify-content-center">
					<div class="text-muted small">TSDB Storage</div>
					<div class="fs-5 fw-bold text-info">{{ storage.tsdb_size }}</div>
				</div>
			</div>
			<div class="col-12 col-md-4">
				<div class="border rounded p-3 h-100 d-flex flex-column justify-content-center">
					<div class="text-muted small">Data Points</div>
					<div class="fs-5 fw-bold text-info">{{ storage.total_points }}</div>
				</div>
			</div>
		</div>
		<hr class="my-3">
		<div
			class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
			<div class="storage-danger-text">
				<strong class="text-danger"><span class="material-icons me-1">warning</span>Danger Zone</strong>
				<small class="text-muted d-block">This action cannot be undone</small>
			</div>
			<div class="d-flex flex-column flex-sm-row gap-2 w-100 storage-danger-actions">
				<button type="button" class="btn btn-outline-danger btn-sm" id="purge-btn" data-bs-toggle="modal"
					data-bs-target="#purgeModal">
					<span class="material-icons">delete</span> <span class="d-none d-sm-inline">Delete all
						Metrics</span><span class="d-inline d-sm-none">Delete Metrics</span>
				</button>
				<button type="button" class="btn btn-outline-danger btn-sm" id="purge-alerts-btn" data-bs-toggle="modal"
					data-bs-target="#purgeAlertsModal">
					<span class="material-icons">notifications_off</span> <span class="d-none d-sm-inline">Clear all
						Alerts</span><span class="d-inline d-sm-none">Clear Alerts</span>
				</button>
			</div>
		</div>
	</div>
</div>
