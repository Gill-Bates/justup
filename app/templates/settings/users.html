{# Settings: Users Tab Content #}
<div class="ju-settings-grid settings-editor">
<div class="card shadow-sm ju-settings-grid__full">
	<div class="card-header d-flex justify-content-between align-items-center">
		<h2 class="h6 mb-0"><span class="material-icons ju-icon-18 me-1" aria-hidden="true">group</span>Users</h2>
		<button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createUserModal">
			<span class="material-icons ju-icon-16 me-1" aria-hidden="true">person_add</span>New User
		</button>
	</div>
	<div class="card-body p-0">
		<div id="users-list" class="ju-table-viewport" role="region" tabindex="0" aria-label="Users">
			{# Users loaded via JS - initial loading state #}
			<div class="text-center text-body-secondary py-4">
				<div class="spinner-border spinner-border-sm text-body-secondary" role="status">
					<span class="visually-hidden">Loading...</span>
				</div>
			</div>
		</div>
	</div>
</div>
</div>
