{# Settings: Recipients Tab Content #}
<div class="card shadow-sm settings-editor">
	<div class="card-header d-flex justify-content-between align-items-center">
		<h2 class="h6 mb-0"><span class="material-icons me-1" style="font-size: 18px;" aria-hidden="true">notifications_active</span>Alert
			Recipients</h2>
		<button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addRecipientModal">
			<span class="material-icons me-1" style="font-size: 16px;" aria-hidden="true">person_add</span>New Recipient
		</button>
	</div>
	<div class="card-body p-0">
		<div id="recipients-list">
			{# Recipients loaded via JS - initial loading state #}
			<div class="text-center text-body-secondary py-4">
				<div class="spinner-border spinner-border-sm text-body-secondary" role="status">
					<span class="visually-hidden">Loading...</span>
				</div>
			</div>
		</div>
	</div>
</div>
