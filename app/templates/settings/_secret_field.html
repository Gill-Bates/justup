{# Shared write-only secret field. The stored value is never rendered; the dots are a fixed placeholder. #}
{% macro secret_field(id, name, label, is_set, help_set, help_unset, clear_id, clear_label) -%}
<div class="secret-field" data-secret-field data-help-set="{{ help_set }}" data-help-unset="{{ help_unset }}">
	<label class="form-label" for="{{ id }}">{{ label }}</label>
	<input type="password" class="form-control" id="{{ id }}" name="{{ name }}" value=""
		placeholder="{{ '••••••••' if is_set else '' }}" autocomplete="new-password"
		aria-describedby="{{ id }}-help">
	<div class="form-text" id="{{ id }}-help" data-secret-help>{{ help_set if is_set else help_unset }}</div>
	<button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="{{ clear_id }}"
		data-secret-clear="{{ id }}" {% if not is_set %}hidden{% endif %}>{{ clear_label }}</button>
</div>
{%- endmacro %}
