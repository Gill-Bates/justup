<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Login – justUp</title>
	<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
	<link href="/static/css/bootstrap.min.css" rel="stylesheet">
	<link href="/static/css/material-icons.css" rel="stylesheet">
	<link href="/static/css/gentelella-layout.css" rel="stylesheet">
	<script src="/static/js/theme-init.js"></script>
	<style>
		/* Finding #7: Allow scroll on small screens (mobile keyboard overlap fix) */
		html,
		body {
			min-height: 100%;
			margin: 0;
			/* overflow: hidden removed - allows scroll when needed */
			/* iOS: Prevent automatic text zoom on rotation */
			-webkit-text-size-adjust: 100%;
		}

		body {
			display: flex;
			align-items: center;
			justify-content: center;
			/* Use dvh for iOS Safari (accounts for address bar), fallback to vh */
			min-height: 100vh;
			min-height: 100dvh;
			padding: 1rem 0;
			/* Prevent cutoff on small screens */
			/* iOS: Safe area padding for notch/home indicator (constant for iOS 11.0-11.2, env for 11.2+) */
			padding-top: max(1rem, constant(safe-area-inset-top));
			padding-top: max(1rem, env(safe-area-inset-top));
			padding-bottom: max(1rem, constant(safe-area-inset-bottom));
			padding-bottom: max(1rem, env(safe-area-inset-bottom));
		}

		/* Keep the form reachable when the viewport is shorter than the card. */
		@media (max-height: 620px) {
			body {
				align-items: flex-start;
			}
		}

		/* Teal top edge of the Gentelella login panel */
		.login-card {
			border-top: 3px solid var(--bs-primary);
		}

		main {
			display: flex;
			justify-content: center;
			width: 100%;
		}

		.login-card {
			max-width: 400px;
			width: 100%;
			margin: 0 1rem;
		}

		/* Heartbeat animation */
		@keyframes heartbeat-dash {
			0% {
				stroke-dashoffset: 600;
			}

			100% {
				stroke-dashoffset: 0;
			}
		}

		/* Finding #9: Fixed SVG aspect ratio - remove negative margin hack */
		.heartbeat-line {
			color: var(--bs-primary);
			margin-bottom: 0.5rem;
			/* Proper spacing instead of hack */
		}

		.heartbeat-path {
			stroke-dasharray: 600;
			animation: heartbeat-dash 2s linear infinite;
		}

		@media (prefers-reduced-motion: reduce) {
			.heartbeat-path {
				animation: none;
			}
		}

		/* The logo SVG is black; invert it in dark theme. */
		.ju-logo {
			height: auto;
		}

		[data-bs-theme="dark"] .ju-logo {
			filter: invert(1);
		}

		/* Honeypot: off-screen, never focusable or announced; bots fill it. */
		.ju-hp {
			position: absolute;
			left: -9999px;
			width: 1px;
			height: 1px;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<main id="main-content">
	<div class="card login-card shadow-lg">
		<div class="card-body p-4 p-sm-5">
			<div class="text-center mb-4">
				{# Finding #9: Heartbeat animation - height matches viewBox to prevent stretching #}
				<svg class="heartbeat-line" aria-hidden="true" focusable="false" width="200" height="40" viewBox="0 0 200 40" fill="none"
					xmlns="http://www.w3.org/2000/svg">
					<path class="heartbeat-path"
						d="M0 20 L40 20 L50 20 L55 5 L60 35 L65 15 L70 25 L75 20 L85 20 L95 20 L100 5 L105 35 L110 15 L115 25 L120 20 L200 20"
						stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
						fill="none"></path>
				</svg>
				<img src="/static/img/justup_1c.svg" class="ju-logo img-fluid mb-3" alt="justUp!" width="220" height="82">
				<h1 class="visually-hidden">Sign in to justUp!</h1>
				<p class="text-body-secondary small">Uptime Monitor - done right!</p>
			</div>
			<div id="error-msg" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
			<form id="login-form" aria-label="Login">
				<div class="mb-3">
					<label for="username" class="form-label">Username</label>
					<input type="text" class="form-control" id="username" name="username" required
						autocomplete="username">
				</div>
				<div class="mb-3">
					<label for="password" class="form-label">Password</label>
					<input type="password" class="form-control" id="password" name="password" required
						autocomplete="current-password">
				</div>
				<div class="ju-hp" aria-hidden="true">
					<label for="website">Website (leave empty)</label>
					<input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
				</div>
				<button type="submit" class="btn btn-primary w-100">
					<span class="material-icons me-1" aria-hidden="true">login</span> Sign In
				</button>
			</form>
		</div>
	</div>
	</main>
	<script src="/static/js/login.js"></script>
</body>

</html>
