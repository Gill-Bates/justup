{% extends "base.html" %}
{% block title %}Targets – justUp!{% endblock %}

{% block content %}

<div class="ui-page">
	<div
		class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
		<h2 class="mb-0"><span class="material-icons me-2">gps_fixed</span>Targets</h2>
		{% if user and user.is_admin %}
		<a href="/ui/targets/new" class="btn btn-primary btn-page-primary">
			<span class="material-icons me-2">add_circle</span>New Target
		</a>
		{% endif %}
	</div>

	<div class="card ui-card">
		<div id="targets-table" hx-get="/ui/fragments/targets-table" hx-trigger="load, every 30s, refresh"
			hx-swap="innerHTML">
			<div class="text-center py-5">
				<div class="spinner-border text-primary" role="status"></div>
			</div>
		</div>
	</div>
</div>
{% endblock %}
